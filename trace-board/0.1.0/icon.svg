<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3140"/>
      <stop offset="1" stop-color="#12151d"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="rgba(255,255,255,0.10)" stroke-width="1.5"/>
  <!-- 三节点阶梯：白折线是执行轨迹（左下走到右上），绿点是已落定的决策，琥珀点是当前刻度 -->
  <path d="M16 46 H32 V32 H48 V18" fill="none" stroke="#e8eef7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="46" r="3.4" fill="#35d3a1"/>
  <circle cx="32" cy="32" r="3.4" fill="#35d3a1"/>
  <circle cx="48" cy="18" r="3.4" fill="#f0b45f"/>
</svg>