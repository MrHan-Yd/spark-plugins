[package]
name = "spark-plugin-local-search"
version = "0.1.0"
edition = "2021"
description = "Spark native 插件:全盘文件名实时搜索(内存索引)"

[[bin]]
name = "spark-plugin-local-search"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true