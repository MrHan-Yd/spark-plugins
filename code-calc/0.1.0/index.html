<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>代码计算器</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <text x="1" y="17.5" font-size="15" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="var(--accent)">{</text>
        <rect x="9.2" y="8.6" width="5.6" height="1.9" rx="0.95" fill="var(--text)"/>
        <rect x="9.2" y="12.4" width="5.6" height="1.9" rx="0.95" fill="var(--text)"/>
        <text x="16.5" y="17.5" font-size="15" font-weight="700" font-family="ui-monospace, Consolas, monospace" fill="var(--accent)">}</text>
      </svg>
      <div class="bt"><b>代码计算器</b><span>用代码的写法算数</span></div>
    </div>
    <div class="tools">
      <button id="btnHelp" class="tb" title="语法与关键字速查">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.9c-.7.35-1 .8-1 1.55"/><circle cx="12" cy="17" r="0.5" fill="currentColor"/></svg>帮助
      </button>
      <button id="btnSample" class="tb" title="载入示例">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3.5l2.3 5.6 6 .5-4.6 3.9 1.4 5.9-5.2-3.2-5.2 3.2 1.4-5.9L3.5 9.6l6-.5z"/></svg>示例
      </button>
      <button id="btnCopy" class="tb" title="复制全部「源码 = 结果」">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>复制结果
      </button>
      <button id="btnClear" class="tb danger" title="清空编辑器">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M6.5 7l.8 12a1 1 0 0 0 1 .9h6.9a1 1 0 0 0 1-.9l.8-12.1M10 11v5M14 11v5"/></svg>清空
      </button>
      <span class="tsep"></span>
      <button id="btnTheme" class="tb icon" title="切换明暗主题">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M20 14.5A8.8 8.8 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></svg>
      </button>
    </div>
  </header>

  <main class="stage">
    <div class="cardwrap">
      <section class="card">
        <div class="codebox" id="codebox">
          <div class="hl mono" id="hl" aria-hidden="true"></div>
          <textarea id="code" class="code mono" spellcheck="false" wrap="off" autocomplete="off"
            autocorrect="off" autocapitalize="off" aria-label="代码编辑区"></textarea>
          <div class="results" id="results" aria-hidden="true"></div>
        </div>
      </section>
    </div>
    <aside class="panel" id="panel" aria-hidden="true">
      <div class="ptabs">
        <button id="ptabHelp" class="ptab">语法</button>
        <button id="ptabKw" class="ptab">关键字</button>
        <button id="pclose" class="tb icon" title="收起面板">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="pbody">
        <div id="phelp"></div>
        <div id="pkw" class="phidden"></div>
      </div>
    </aside>
  </main>

  <footer class="dock">
    <div class="vhead"><span class="vt">变量</span><span id="vcount" class="vc">0</span><span class="vhint">点击变量可复制其值</span></div>
    <div class="vlist" id="vlist"><span class="vempty">暂无变量 — 用 let 定义一个试试</span></div>
    <div class="status"><span id="stL">就绪</span><span id="stR"></span></div>
  </footer>
</div>

<div id="toast" class="toast" role="status"></div>
<div id="mask" class="mask hidden">
  <div class="mbox" role="dialog" aria-modal="true">
    <div id="mTitle" class="mtitle"></div>
    <div id="mBody" class="mbody"></div>
    <div class="mrow"><button id="mCancel" class="mb">取消</button><button id="mOk" class="mb primary">确定</button></div>
  </div>
</div>

<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
