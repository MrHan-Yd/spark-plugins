<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景主卡片 -->
  <rect width="128" height="128" rx="28" fill="url(#bgGradient)"/>

  <!-- 左侧面板卡片 -->
  <rect x="20" y="24" width="38" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- 左侧代码行 -->
  <rect x="28" y="36" width="22" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="28" y="47" width="16" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="28" y="58" width="22" height="6.5" rx="3" fill="#EF4444" fill-opacity="0.9"/>
  <rect x="28" y="72" width="18" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="28" y="83" width="14" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 右侧面板卡片 -->
  <rect x="70" y="24" width="38" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.16" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- 右侧代码行 -->
  <rect x="78" y="36" width="22" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="78" y="47" width="16" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="78" y="58" width="22" height="6.5" rx="3" fill="#22C55E" fill-opacity="0.9"/>
  <rect x="78" y="72" width="18" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.4"/>
  <rect x="78" y="83" width="14" height="4.5" rx="2.25" fill="#FFFFFF" fill-opacity="0.3"/>

  <!-- 中间连接/交换指示箭头 -->
  <g filter="url(#shadow)">
    <circle cx="64" cy="64" r="13" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/>
    <path d="M59 61h10m-3-3l3 3-3 3M69 67H59m3 3l-3-3 3-3" stroke="#A5B4FC" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
