<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内容对比</title>
<style>
/* ================= 现代视觉体系 & 变量系统 ================= */
:root {
  --row-h: 20px;
  --topbar-h: 54px;
  --status-h: 32px;
  --radius-sm: 6px;
  --radius-md: 9px;
  --radius-lg: 13px;
  --radius-xl: 16px;
  --radius-full: 9999px;

  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", "Fira Code", Consolas, Menlo, Monaco, monospace;
}

[data-theme="dark"] {
  --bg: #090c10;
  --bg-subtle: #0d1117;
  --surface: rgba(18, 22, 34, 0.78);
  --surface-elevated: #161b26;
  --surface-card: rgba(22, 27, 40, 0.85);
  --surface-card-hover: rgba(30, 37, 54, 0.95);
  --surface-glass: rgba(13, 17, 26, 0.72);
  --surface-input: #0e121a;

  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --border-focus: #6366f1;
  --border-hover: rgba(99, 102, 241, 0.4);

  --text: #f0f3f8;
  --text-muted: #8b95a8;
  --text-dim: #545e75;

  --primary: #6366f1;
  --primary-hover: #4f46e5;
  --primary-light: rgba(99, 102, 241, 0.16);
  --primary-glow: rgba(99, 102, 241, 0.35);
  --sel-bg: rgba(129, 140, 248, 0.38);

  --ins-bg: rgba(34, 197, 94, 0.13);
  --ins-word: rgba(34, 197, 94, 0.36);
  --ins-text: #4ade80;

  --del-bg: rgba(239, 68, 68, 0.13);
  --del-bar: #ef4444;
  --del-word: rgba(239, 68, 68, 0.40);
  --del-text: #f87171;

  --mod-bar: #f59e0b;
  --warn-bg: rgba(245, 158, 11, 0.15);
  --warn-border: rgba(245, 158, 11, 0.40);
  --ph-bg: rgba(255, 255, 255, 0.015);
  --gutter-bg: #0c1017;
  --gutter-text: #424d63;
  --gutter-border: rgba(255, 255, 255, 0.05);

  --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.35);
  --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.45);

  color-scheme: dark;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --bg-subtle: #f1f5f9;
  --surface: rgba(255, 255, 255, 0.85);
  --surface-elevated: #ffffff;
  --surface-card: rgba(255, 255, 255, 0.9);
  --surface-card-hover: #ffffff;
  --surface-glass: rgba(255, 255, 255, 0.78);
  --surface-input: #ffffff;

  --border: rgba(0, 0, 0, 0.08);
  --border-strong: rgba(0, 0, 0, 0.14);
  --border-focus: #4f46e5;
  --border-hover: rgba(79, 70, 229, 0.35);

  --text: #0f172a;
  --text-muted: #64748b;
  --text-dim: #94a3b8;

  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-light: rgba(79, 70, 229, 0.10);
  --primary-glow: rgba(79, 70, 229, 0.25);
  --sel-bg: rgba(79, 70, 229, 0.20);

  --ins-bg: rgba(34, 197, 94, 0.13);
  --ins-word: rgba(22, 163, 74, 0.28);
  --ins-text: #15803d;

  --del-bg: rgba(239, 68, 68, 0.11);
  --del-bar: #dc2626;
  --del-word: rgba(220, 38, 38, 0.28);
  --del-text: #b91c1c;

  --mod-bar: #d97706;
  --warn-bg: rgba(217, 119, 6, 0.12);
  --warn-border: rgba(217, 119, 6, 0.35);
  --ph-bg: rgba(15, 23, 42, 0.02);
  --gutter-bg: #f8fafc;
  --gutter-text: #94a3b8;
  --gutter-border: rgba(0, 0, 0, 0.06);

  --shadow-sm: 0 1px 4px rgba(15, 23, 42, 0.05);
  --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
  --shadow-lg: 0 16px 36px rgba(15, 23, 42, 0.12);

  color-scheme: light;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  height: 100%;
  overflow: hidden;
  font-family: var(--sans);
  font-size: 13px;
  background-color: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

body::before {
  content: "";
  position: fixed;
  top: -15%;
  right: -10%;
  width: 550px;
  height: 550px;
  background: radial-gradient(circle, var(--primary-glow) 0%, transparent 68%);
  opacity: 0.35;
  filter: blur(70px);
  pointer-events: none;
  z-index: 0;
}

body::after {
  content: "";
  position: fixed;
  bottom: -15%;
  left: -10%;
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(34, 197, 94, 0.15) 0%, transparent 70%);
  opacity: 0.25;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}

/* 选区：只换背景不改字色——改字色在红绿差异底色上会又暗又花；
   背景要够实，否则会和红绿行底混成浑浊色 */
::selection { background: var(--sel-bg); }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(140, 150, 170, 0.25); border-radius: 6px; }
::-webkit-scrollbar-thumb:hover { background: rgba(140, 150, 170, 0.45); }

button { font-family: inherit; color: inherit; background: none; border: none; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; }

.app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column; }

/* ================= 顶栏 ================= */
.topbar {
  height: var(--topbar-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--surface-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  gap: 12px;
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-logo {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  box-shadow: 0 3px 12px var(--primary-glow);
  color: #fff;
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.brand-logo:hover { transform: scale(1.06) rotate(-3deg); }
.brand-logo svg { width: 18px; height: 18px; }

.brand-text { display: flex; flex-direction: column; }
.brand-name { font-size: 13.5px; font-weight: 700; letter-spacing: -0.2px; line-height: 1.2; }
.brand-subtitle { font-size: 10.5px; color: var(--text-muted); }

.topbar-center { display: flex; align-items: center; }
/* 子元素 margin 代替容器 gap：pill 收起动画要把间距一起压到 0，容器 gap 做不到 */
.topbar-center > * + * { margin-left: 8px; }

.segmented {
  display: flex;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 3px;
  gap: 2px;
}
.segmented button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: none;
  background: transparent;
  color: var(--text-muted);
  font-size: 12px;
  font-weight: 500;
  padding: 4px 12px;
  border-radius: var(--radius-full);
  cursor: pointer;
  transition: all 0.18s cubic-bezier(0.4, 0, 0.2, 1);
}
.segmented button svg { width: 13px; height: 13px; opacity: 0.7; }
.segmented button:hover { color: var(--text); }
.segmented button.active {
  background: var(--surface-elevated);
  color: var(--text);
  font-weight: 600;
  box-shadow: var(--shadow-sm);
}
.segmented button.active svg { opacity: 1; color: var(--primary); }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 28px;
  padding: 0 12px;
  border-radius: var(--radius-full);
  border: 1px solid var(--border);
  background: var(--surface-card);
  color: var(--text-muted);
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  overflow: hidden;
  white-space: nowrap;
  transition:
    max-width 0.24s cubic-bezier(0.22, 1, 0.36, 1),
    margin-left 0.24s cubic-bezier(0.22, 1, 0.36, 1),
    padding 0.24s cubic-bezier(0.22, 1, 0.36, 1),
    border-width 0.24s cubic-bezier(0.22, 1, 0.36, 1),
    opacity 0.16s ease,
    background-color 0.18s ease,
    border-color 0.18s ease,
    color 0.18s ease,
    transform 0.18s ease;
}
/* 内容不跟随挤压：收起时保持自然宽度只被裁切，不重排不换行（否则动画发糊） */
.pill > * { flex: none; }
.pill .pill-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--text-dim);
  transition: all 0.2s ease;
}
.pill:hover { border-color: var(--border-hover); color: var(--text); transform: translateY(-1px); }
.pill.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary); font-weight: 600; }
.pill.on .pill-dot { background: var(--primary); box-shadow: 0 0 6px var(--primary-glow); }

/* 模式切换收起：display:none 无法过渡，宽度由 JS 写内联 max-width（自然宽 → 0 → 自然宽），
   这里只负责边距/内边距/边框/透明度同步压平，过渡结束后 JS 再补 hidden */
.pill.collapse {
  margin-left: 0;
  padding-left: 0;
  padding-right: 0;
  border-width: 0;
  opacity: 0;
  pointer-events: none;
}

.actions { display: flex; align-items: center; gap: 6px; }
.divider-v { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }

.icon-btn {
  width: 32px; height: 32px;
  display: grid; place-items: center;
  border-radius: var(--radius-md);
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  transition: all 0.18s ease;
}
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn:hover {
  background: var(--surface-card);
  border-color: var(--border);
  color: var(--text);
  transform: translateY(-1px);
}
.icon-btn:active { transform: translateY(0); }

/* 差异数徽标（文本模式，顶栏右侧） */
.diff-count {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 11px;
  border-radius: var(--radius-full);
  font-size: 12px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  border: 1px solid transparent;
  transition: all 0.18s ease;
}
.diff-count.has {
  background: var(--warn-bg);
  border-color: var(--warn-border);
  color: var(--mod-bar);
}
.diff-count.same {
  background: var(--ins-bg);
  border-color: var(--ins-word);
  color: var(--ins-text);
}
.diff-count.has:hover { transform: translateY(-1px); filter: brightness(1.12); }

/* ================= 文本对比区：输入框即对比区 ================= */
.textzone {
  flex: 1;
  min-height: 0;
  display: flex;
  padding: 10px 14px 8px 14px;
  gap: 8px;
  position: relative;
}

.editor-card {
  flex: 1 1 50%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  position: relative;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: border-color 0.2s, box-shadow 0.2s, background-color 0.25s;
}
.editor-card:focus-within {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 2px var(--primary-light);
}

.pane-head {
  height: 36px;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 12px;
  background: var(--bg-subtle);
  border-bottom: 1px solid var(--border);
}
.pane-dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }
.editor-card[data-side="left"] .pane-dot { background: #ef4444; box-shadow: 0 0 6px rgba(239, 68, 68, 0.4); }
.editor-card[data-side="right"] .pane-dot { background: #22c55e; box-shadow: 0 0 6px rgba(34, 197, 94, 0.4); }

.pane-label { font-size: 12px; font-weight: 600; color: var(--text); letter-spacing: -0.1px; }

.file-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 170px;
  padding: 2px 8px;
  border-radius: var(--radius-full);
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  font-size: 11px;
  color: var(--text-muted);
  transition: all 0.15s;
}
.file-chip[hidden] { display: none; }
.file-chip svg { width: 12px; height: 12px; flex: 0 0 auto; color: var(--primary); }
.chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip-x {
  border: none; background: transparent;
  color: var(--text-dim); font-size: 12px;
  line-height: 1; padding: 0 2px; cursor: pointer;
  border-radius: 4px;
}
.chip-x:hover { color: var(--text); }

.pane-actions { margin-left: auto; display: flex; gap: 6px; }

.mini-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.mini-btn svg { width: 11px; height: 11px; opacity: 0.8; }
.mini-btn:hover { background: var(--surface-elevated); color: var(--text); border-color: var(--border-hover); }

/* 编辑体：行号槽 + (高亮垫层 + textarea) */
.ta-body { flex: 1; min-height: 0; display: flex; position: relative; }

.gutter {
  flex: 0 0 46px;
  position: relative;
  overflow: hidden;
  background: var(--gutter-bg);
  border-right: 1px solid var(--gutter-border);
}
.gutter-inner {
  position: absolute;
  top: 0; left: 0; right: 0;
  padding: 8px 10px 8px 0;
  white-space: pre;
  line-height: var(--row-h);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--gutter-text);
  font-variant-numeric: tabular-nums;
  text-align: right;
  will-change: transform;
}
.gnum { color: inherit; }
.gnum.g-del { color: var(--del-text); font-weight: 600; }
.gnum.g-ins { color: var(--ins-text); font-weight: 600; }
.gnum.g-mod { color: var(--mod-bar); font-weight: 600; }

.ta-wrap { flex: 1; min-width: 0; position: relative; background: var(--surface-input); }

.hl {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}
.hl-inner {
  padding: 8px 14px 8px 10px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: var(--row-h);
  white-space: pre;
  tab-size: 2;
  width: max-content;
  min-width: 100%;
  will-change: transform;
}

textarea {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%;
  height: 100%;
  border: none;
  resize: none;
  outline: none;
  background: transparent;
  color: var(--text);
  font-family: var(--mono);
  font-size: 12px;
  line-height: var(--row-h);
  padding: 8px 14px 8px 10px;
  white-space: pre;
  tab-size: 2;
  caret-color: var(--primary);
  user-select: text;
}
textarea::placeholder { color: var(--text-dim); }

.hl-line {
  height: var(--row-h);
  line-height: var(--row-h);
  white-space: pre;
}
.hl-line.l-del, .hl-line.l-mod-l { background: var(--del-bg); }
.hl-line.l-ins, .hl-line.l-mod-r { background: var(--ins-bg); }
.hl-line.cur { outline: 1.5px solid var(--primary); outline-offset: -1.5px; }

/* 词级差异高亮：只上实底色块。不能加边框/内边距——会改变行内布局，
   使高亮层与 textarea 的文字错位，色块就不再贴合真正差异的字符 */
.w-del { background: var(--del-word); border-radius: 3px; }
.w-ins { background: var(--ins-word); border-radius: 3px; }

.editor-card.dropping {
  outline: 2px dashed var(--primary);
  outline-offset: -4px;
  background: var(--primary-light);
}

.grip-v {
  flex: 0 0 6px;
  cursor: col-resize;
  background: transparent;
  position: relative;
  border-radius: 4px;
  transition: background 0.15s;
}
.grip-v::after {
  content: "";
  position: absolute;
  left: 50%; top: 50%;
  width: 2px; height: 32px;
  transform: translate(-50%, -50%);
  border-radius: 2px;
  background: var(--border-strong);
  transition: all 0.15s;
}
.grip-v:hover::after, .grip-v.active::after {
  background: var(--primary);
  height: 48px;
  width: 3px;
  box-shadow: 0 0 8px var(--primary-glow);
}

/* 差异导航胶囊 */
.nav-pill {
  position: absolute;
  right: 28px;
  bottom: 20px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-lg);
  z-index: 10;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.nav-pill button {
  width: 26px; height: 26px;
  display: grid; place-items: center;
  border: none; background: transparent;
  color: var(--text-muted);
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.15s;
}
.nav-pill button:hover { background: var(--surface-card-hover); color: var(--text); }
.nav-pill button svg { width: 14px; height: 14px; }
.nav-pos {
  min-width: 48px;
  text-align: center;
  font-size: 11.5px;
  font-weight: 600;
  font-family: var(--mono);
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

/* ================= 文件对比区 ================= */
.filezone {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  padding: 12px 14px;
  gap: 10px;
}

.slots { flex: 0 0 auto; display: flex; align-items: stretch; gap: 10px; }

.slot {
  flex: 1 1 50%;
  min-width: 0;
  min-height: 96px;
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--radius-lg);
  background: var(--surface-card);
  display: grid;
  place-items: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.18s, background 0.18s, box-shadow 0.18s;
}
.slot:hover { border-color: var(--border-hover); box-shadow: var(--shadow-sm); }
.slot.filled { border-style: solid; }
.slot.dropping { border-color: var(--primary); background: var(--primary-light); }

.slot-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  color: var(--text-muted);
  padding: 14px;
  text-align: center;
}
.slot-empty svg { width: 26px; height: 26px; opacity: 0.65; }
.slot-hint { font-size: 12.5px; font-weight: 600; color: var(--text); }
.slot-sub { font-size: 11px; color: var(--text-dim); }

.slot-file {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: var(--surface-card);
}
.sf-icon {
  flex: 0 0 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: var(--radius-md);
  background: var(--primary-light);
  color: var(--primary);
}
.sf-icon svg { width: 20px; height: 20px; }
.sf-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.sf-name { font-size: 12.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sf-info { font-size: 11px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sf-progress {
  height: 4px;
  margin-top: 3px;
  border-radius: 2px;
  background: var(--bg-subtle);
  overflow: hidden;
}
.sf-bar {
  height: 100%;
  width: 0%;
  border-radius: 2px;
  background: linear-gradient(90deg, var(--primary), #8b5cf6);
  transition: width 0.15s linear;
}
.sf-x {
  flex: 0 0 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text-muted);
  font-size: 13px;
  line-height: 1;
  cursor: pointer;
  transition: all 0.15s;
}
.sf-x:hover { color: var(--del-text); border-color: var(--del-bar); background: var(--del-bg); }

.vs-badge {
  align-self: center;
  flex: 0 0 auto;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--text-muted);
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 5px 11px;
  box-shadow: var(--shadow-sm);
}

.file-result {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  overflow: auto;
  background: var(--surface-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  padding: 12px;
}

.verdict {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 14px;
  border-radius: var(--radius-md);
  font-size: 13px;
  font-weight: 600;
}
.verdict svg { width: 18px; height: 18px; flex: 0 0 auto; }
.verdict.ok { background: var(--ins-bg); color: var(--ins-text); }
.verdict.bad { background: var(--del-bg); color: var(--del-text); }
.verdict.neutral { background: var(--bg-subtle); color: var(--text-muted); }
.verdict-sub { font-size: 11.5px; font-weight: 400; opacity: 0.85; }

.hash-rows { flex: 0 0 auto; display: flex; flex-direction: column; gap: 6px; }
.hash-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 12px;
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  font-family: var(--mono);
  font-size: 11.5px;
  cursor: pointer;
  transition: border-color 0.15s;
}
.hash-row:hover { border-color: var(--border-hover); }
.hash-alg {
  flex: 0 0 62px;
  font-family: var(--sans);
  font-weight: 700;
  font-size: 11px;
  color: var(--text-muted);
}
.hash-val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); user-select: text; }
.hash-mark { flex: 0 0 auto; font-weight: 800; font-family: var(--sans); }
.hash-mark.match { color: var(--ins-text); }
.hash-mark.miss { color: var(--del-text); }
.hash-mark.na { color: var(--text-dim); font-weight: 400; }

.img-panel { flex: 1; min-height: 320px; display: flex; flex-direction: column; gap: 8px; }

.img-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.img-ctl { display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: var(--text-muted); }
.img-ctl input[type="range"] { width: 130px; accent-color: var(--primary); cursor: pointer; }
.img-ctl select {
  font-family: inherit;
  font-size: 11.5px;
  color: var(--text);
  background: var(--surface-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 3px 6px;
  cursor: pointer;
}
.img-stat { font-family: var(--mono); font-size: 11.5px; color: var(--text); font-variant-numeric: tabular-nums; }

.img-stage {
  flex: 1;
  min-height: 260px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  background: var(--surface-input);
  overflow: auto;
  display: flex;
}
.img-stage.checker {
  background-image:
    linear-gradient(45deg, rgba(128, 128, 128, 0.14) 25%, transparent 25%, transparent 75%, rgba(128, 128, 128, 0.14) 75%),
    linear-gradient(45deg, rgba(128, 128, 128, 0.14) 25%, transparent 25%, transparent 75%, rgba(128, 128, 128, 0.14) 75%);
  background-size: 20px 20px;
  background-position: 0 0, 10px 10px;
}
.img-stage.black { background: #000; }

.img-pane {
  flex: 1 1 50%;
  min-width: 0;
  display: grid;
  place-items: center;
  padding: 10px;
  overflow: auto;
}
.img-pane + .img-pane { border-left: 1px solid var(--border); }
.img-pane img { max-width: 100%; max-height: 100%; object-fit: contain; }
.img-pane .pane-tag {
  position: absolute;
  top: 8px; left: 10px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
  background: var(--surface-elevated);
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  padding: 1px 8px;
  pointer-events: none;
}
.img-pane { position: relative; }

.img-stack {
  flex: 1;
  width: 100%;
  height: 100%;
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 10px;
}
.img-stack img { grid-area: 1 / 1; max-width: 100%; max-height: 100%; object-fit: contain; }
.img-stack img.top { mix-blend-mode: normal; }
.img-stack.blend img.top { mix-blend-mode: difference; }

.img-diff {
  margin: auto;
  max-width: none;
  image-rendering: pixelated;
}

.img-meta { flex: 0 0 auto; font-size: 11.5px; color: var(--text-muted); font-family: var(--mono); }
.img-warn { color: var(--mod-bar); font-weight: 600; }

.text-bridge { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-md); }
.text-bridge .tb-text { flex: 1; font-size: 12px; color: var(--text-muted); }

.cta-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 14px;
  border-radius: var(--radius-full);
  border: 1px solid var(--primary);
  background: var(--primary-light);
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.cta-btn:hover { background: var(--primary); color: #fff; box-shadow: 0 2px 10px var(--primary-glow); }
.cta-btn svg { width: 13px; height: 13px; }

/* ================= 状态栏 ================= */
.statusbar {
  height: var(--status-h);
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  font-size: 11.5px;
  color: var(--text-muted);
  background: var(--surface-glass);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
}
.stat-tag { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.stat-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: var(--radius-full);
  font-weight: 600;
  font-size: 11px;
}
.stat-badge.ins { background: var(--ins-bg); color: var(--ins-text); }
.stat-badge.del { background: var(--del-bg); color: var(--del-text); }
.stat-badge.sim { background: var(--primary-light); color: var(--primary); }
.stat-badge.same { background: var(--ins-bg); color: var(--ins-text); }

.statusbar .spacer { flex: 1; }
.st-note { color: var(--text-dim); }

/* ================= Toast ================= */
.toast {
  position: fixed;
  left: 50%; bottom: 48px;
  transform: translate(-50%, 12px) scale(0.96);
  padding: 8px 18px;
  border-radius: var(--radius-full);
  background: var(--surface-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1), transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
.toast.error { border-color: rgba(239, 68, 68, 0.4); color: #f87171; }

body.resizing-col { cursor: col-resize; }
body.resizing-col * { cursor: inherit !important; user-select: none !important; }

/* ---- 过渡动画 ----
   只动 background/outline/transform/opacity——高亮层内任何影响行内宽度的属性都会导致与 textarea 错位 */
@keyframes hlIn { from { background-color: transparent; } }
.hl-line.l-del, .hl-line.l-mod-l, .hl-line.l-ins, .hl-line.l-mod-r { animation: hlIn 0.22s ease; }
@keyframes wIn { from { background-color: transparent; } }
.w-del, .w-ins { animation: wIn 0.22s ease; }
@keyframes curIn { from { outline-color: transparent; } }
.hl-line.cur { animation: curIn 0.18s ease; }
@keyframes zoneIn { from { opacity: 0; transform: translateY(6px); } }
.zone-in { animation: zoneIn 0.24s cubic-bezier(0.4, 0, 0.2, 1); }

/* 主题切换平滑过渡 */
html, body { transition: background-color 0.25s ease, color 0.25s ease; }
.gutter, .ta-wrap { transition: background-color 0.25s ease, border-color 0.25s ease; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<div class="app">

  <!-- 顶栏 -->

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
      <span class="divider-v"></span>
      <button class="icon-btn" id="btnTheme" title="切换明暗主题">
        <svg id="icoTheme" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></svg>
      </button>
    </div>
  </header>

  <!-- 文本对比：两个输入框本身就是对比结果 -->
  <main class="textzone" id="textZone">
    <div class="editor-card" id="paneLeft" data-side="left">
      <div class="pane-head">
        <span class="pane-dot"></span>
        <span class="pane-label">原文本</span>
        <button class="file-chip" id="chipLeft" hidden title="移除文件标记">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="chip-name"></span>

    <div class="editor-card" id="paneRight" data-side="right">

          <span class="chip-name"></span>
          <span class="chip-x">×</span>
        </button>
        <div class="pane-actions">
          <button class="mini-btn" data-act="clip" data-side="right" title="从剪贴板填入">

<script>
"use strict";

/* ---------- DOM 引用 ---------- */
const $ = (id) => document.getElementById(id);
const $taLeft = $("taLeft");
const $taRight = $("taRight");
const $hlLeftInner = $("hlLeftInner");
const $hlRightInner = $("hlRightInner");

const $gutRightInner = $("gutRightInner");

const $fileZone = $("fileZone");
const $gripV = $("gripV");
const $navPill = $("navPill");
const $navPos = $("navPos");
const $stVerdict = $("stVerdict");
const $stAddBadge = $("stAddBadge");
const $stDelBadge = $("stDelBadge");
const $stSimBadge = $("stSimBadge");
const $stLines = $("stLines");
const $stNote = $("stNote");
const $toast = $("toast");
const $slotInput = $("slotInput");
const $chipLeft = $("chipLeft");
const $chipRight = $("chipRight");
const $diffCount = $("diffCount");

/* ---------- 常量与状态 ---------- */
const ROW_H = 20;                    // 单行高度 px（textarea 与高亮垫层必须一致）
const HL_LINE_CAP = 12000;           // 高亮垫层最大渲染行数
const EQ_CHUNK = 256;                // eq 折叠块切片行数：编辑只命中一片，其余片按内容复用
const MAX_TEXT_BYTES = 10 * 1024 * 1024;

/* ---------- diff 核心算法引擎（纯函数，零依赖） ---------- */

function normalizeNewlines(text) {
  return text.replace(/\r\n?/g, "\n");
}

function splitLines(text) {
  const lines = normalizeNewlines(text).split("\n");
  if (lines.length > 1 && lines[lines.length - 1] === "") lines.pop();
  return lines;
}

function lineKey(line, ignoreWs, ignoreCase) {
  let s = line;
  if (ignoreWs) s = s.replace(/\s+/g, " ").trim();
  if (ignoreCase) s = s.toLowerCase();
  return s;
}

// 相似度兜底：无词级 segs 的行对，掐头去尾估算两侧公共字符数（不重叠）。
function commonEndsLen(la, lb) {
  const n = Math.min(la.length, lb.length);
  let p = 0;
  while (p < n && la[p] === lb[p]) p++;
  let s = 0;
  while (s < n - p && la[la.length - 1 - s] === lb[lb.length - 1 - s]) s++;
  return p + s;
}

// Myers O(ND) 最短编辑脚本；超过 cap 步返回 null（调用方降级）。
function myersOps(a, b, cap) {
  const N = a.length;
  const M = b.length;
  const ops = [];
  if (N === 0 || M === 0) {
    for (let i = 0; i < N; i++) ops.push({ t: "del", ai: i, bi: -1 });
    for (let j = 0; j < M; j++) ops.push({ t: "ins", ai: -1, bi: j });
    return ops;
  }
  const maxD = N + M;
  const limit = Math.min(cap == null ? maxD : cap, maxD);
  const off = maxD;
  const V = new Int32Array(2 * maxD + 1);
  const rows = [];
  let D = -1;
  for (let d = 0; d <= limit; d++) {
    const row = new Int32Array(d + 1);
    for (let k = -d; k <= d; k += 2) {
      let x;
      if (k === -d || (k !== d && V[off + k - 1] < V[off + k + 1])) {
        x = V[off + k + 1];
      } else {
        x = V[off + k - 1] + 1;
      }
      let y = x - k;
      while (x < N && y < M && a[x] === b[y]) { x++; y++; }
      V[off + k] = x;
      row[(k + d) >> 1] = x;
      if (x >= N && y >= M) { D = d; break; }
    }
    rows.push(row);
    if (D >= 0) break;
  }
  if (D === -1) return null;
  let x = N;
  let y = M;
  for (let d = D; d >= 1; d--) {
    const prev = rows[d - 1];
    const k = x - y;
    let down;
    if (k === -d) down = true;
    else if (k === d) down = false;
    else down = prev[(k - 1 + d - 1) >> 1] < prev[(k + 1 + d - 1) >> 1];
    if (down) {
      const xStart = prev[(k + 1 + d - 1) >> 1];
      const yStart = xStart - k;
      for (let i = x - 1; i >= xStart; i--) ops.push({ t: "eq", ai: i, bi: i - k });
      ops.push({ t: "ins", ai: -1, bi: yStart - 1 });
      x = xStart;
      y = yStart - 1;
    } else {
      const xStart = prev[(k - 1 + d - 1) >> 1] + 1;
      const yStart = xStart - k;
      for (let i = x - 1; i >= xStart; i--) ops.push({ t: "eq", ai: i, bi: i - k });
      ops.push({ t: "del", ai: xStart - 1, bi: -1 });
      x = xStart - 1;
      y = yStart;
    }
  }
  while (x > 0) { ops.push({ t: "eq", ai: x - 1, bi: y - 1 }); x--; y--; }
  ops.reverse();
  return ops;
}

// 词级切分：空白 / 单词 / CJK 及其他单字符
function tokenize(line) {
  return line.match(/\s+|\w+|[^\s\w]/g) || [];
}

function normalizeOps(ops) {
  const out = [];
  let dels = [];
  let inses = [];
  const flush = () => {
    for (const o of dels) out.push(o);
    for (const o of inses) out.push(o);
    dels = [];
    inses = [];
  };
  for (const op of ops) {
    if (op.t === "eq") { flush(); out.push(op); }
    else if (op.t === "del") dels.push(op);
    else inses.push(op);
  }
  flush();
  return out;
}

// 等价最短编辑脚本归一化：eq 后面紧跟着内容相同的 ins 时，把 ins 左移贴上去。
// 否则 "123"→"133" 会被解读成「删 2、末尾补 3」，高亮落在行尾而不是中间那个 3。
function slideOps(ops, a, b) {
  let changed = true;
  while (changed) {
    changed = false;
    for (let i = 0; i < ops.length - 1; i++) {
      const o = ops[i];
      const n = ops[i + 1];
      if (o.t === "eq" && n.t === "ins" && o.bi < n.bi && b[o.bi] === b[n.bi]) {
        ops[i] = { t: "ins", ai: -1, bi: o.bi };
        ops[i + 1] = { t: "eq", ai: o.ai, bi: n.bi };
        changed = true;
      }
    }
  }
}

function pushSeg(arr, text, kind) {
  const last = arr[arr.length - 1];
  if (last && last.kind === kind) last.text += text;
  else arr.push({ text, kind });
}

// 对一段连续「删+插」区做字符级二次 diff，把高亮缩到真正不同的字符上
// （如 "World" → "Worldx" 只标 "x"）；超长或步数超限时返回 null 降回词级。
function refineRun(dToks, iToks) {
  const s = dToks.join("");
  const t = iToks.join("");
  if (!s || !t) return null;
  if (s.length + t.length > 1600) return null;
  const sa = s.split("");
  const sb = t.split("");
  const ops = myersOps(sa, sb, 600);
  if (ops === null) return null;
  slideOps(ops, sa, sb);
  const aSegs = [];
  const bSegs = [];
  for (const op of ops) {
    if (op.t === "eq") {
      pushSeg(aSegs, s[op.ai], "eq");
      pushSeg(bSegs, t[op.bi], "eq");
    } else if (op.t === "del") {
      pushSeg(aSegs, s[op.ai], "del");
    } else {
      pushSeg(bSegs, t[op.bi], "ins");
    }
  }
  return { aSegs, bSegs };
}

function wordDiff(la, lb, cap) {
  const ta = tokenize(la);
  const tb = tokenize(lb);
  if (ta.length === 0 && tb.length === 0) return null;
  const ops = myersOps(ta, tb, cap == null ? 800 : cap);
  if (ops === null) return null;
  slideOps(ops, ta, tb);
  const aSegs = [];
  const bSegs = [];
  let i = 0;
  while (i < ops.length) {
    if (ops[i].t === "eq") {
      pushSeg(aSegs, ta[ops[i].ai], "eq");
      pushSeg(bSegs, tb[ops[i].bi], "eq");
      i++;
      continue;
    }
    const dToks = [];
    const iToks = [];
    while (i < ops.length && ops[i].t !== "eq") {
      if (ops[i].t === "del") dToks.push(ta[ops[i].ai]);
      else iToks.push(tb[ops[i].bi]);
      i++;
    }
    const fine = refineRun(dToks, iToks);
    if (fine) {
      for (const s of fine.aSegs) pushSeg(aSegs, s.text, s.kind);
      for (const s of fine.bSegs) pushSeg(bSegs, s.text, s.kind);
    } else {
      for (const t of dToks) pushSeg(aSegs, t, "del");
      for (const t of iToks) pushSeg(bSegs, t, "ins");
    }
  }
  return { aSegs, bSegs };
}

function unifiedText(ops, a, b) {
  const out = [];
  for (const op of ops) {
    if (op.t === "eq") out.push("  " + a[op.ai]);
    else if (op.t === "del") out.push("- " + a[op.ai]);
    else out.push("+ " + b[op.bi]);
  }
  return out.join("\n");
}

// 放引擎段内：worker 只加载引擎代码，这两个预算常量必须随引擎一起进去
const WORD_BUDGET = 600;             // 词级 diff 的行对数预算
const WORD_MAX_LEN = 3000;           // 参与词级 diff 的行对长度上限

// 行级 diff 总入口：掐头去尾 + Myers，产出每行状态/词级 segs/差异块。
function computeDiff(aRaw, bRaw, opts) {
  const t0 = performance.now();
  const ignoreWs = !!(opts && opts.ignoreWs);
  const ignoreCase = !!(opts && opts.ignoreCase);
  const a = aRaw === "" ? [] : splitLines(aRaw);
  const b = bRaw === "" ? [] : splitLines(bRaw);
  const ka = a.map((l) => lineKey(l, ignoreWs, ignoreCase));
  const kb = b.map((l) => lineKey(l, ignoreWs, ignoreCase));

  const ops = [];
  let pre = 0;
  while (pre < ka.length && pre < kb.length && ka[pre] === kb[pre]) pre++;
  let suf = 0;
  while (
    suf < ka.length - pre && suf < kb.length - pre &&
    ka[ka.length - 1 - suf] === kb[kb.length - 1 - suf]
  ) suf++;

  for (let i = 0; i < pre; i++) ops.push({ t: "eq", ai: i, bi: i });

  const midALen = ka.length - pre - suf;
  const midBLen = kb.length - pre - suf;
  let midOps = null;
  let rough = false;
  if (Math.max(midALen, midBLen) > 5000) {
    rough = true;
  } else {
    const midKa = ka.slice(pre, pre + midALen);
    const midKb = kb.slice(pre, pre + midBLen);
    midOps = myersOps(midKa, midKb, 1500);
    if (midOps === null) rough = true;
    else slideOps(midOps, midKa, midKb);
  }
  if (midOps === null) {
    for (let i = 0; i < midALen; i++) ops.push({ t: "del", ai: pre + i, bi: -1 });
    for (let j = 0; j < midBLen; j++) ops.push({ t: "ins", ai: -1, bi: pre + j });
  } else {
    for (const op of midOps) {
      ops.push({
        t: op.t,
        ai: op.ai < 0 ? -1 : op.ai + pre,
        bi: op.bi < 0 ? -1 : op.bi + pre,
      });
    }
  }
  for (let i = ka.length - suf; i < ka.length; i++) {
    ops.push({ t: "eq", ai: i, bi: i - ka.length + kb.length });
  }

  const nops = normalizeOps(ops);

  const statusA = new Array(a.length).fill("");
  const statusB = new Array(b.length).fill("");
  const segsA = new Array(a.length).fill(null);
  const segsB = new Array(b.length).fill(null);
  const blocks = [];
  let added = 0, removed = 0, wdBudget = WORD_BUDGET;
  // 相似度 = 两侧匹配字符 / 两侧总字符（difflib ratio 公式 2M/T）：
  // 相同行整行计入，mod 行对取 segs 公共段，超预算的行对掐头去尾粗估
  let simMatched = 0;
  let simTotal = 0;
  for (const l of a) simTotal += l.length;
  for (const l of b) simTotal += l.length;
  let simScan = 200000;
  let i = 0;
  while (i < nops.length) {
    if (nops[i].t === "eq") {
      simMatched += a[nops[i].ai].length + b[nops[i].bi].length;
      statusA[nops[i].ai] = "eq";
      statusB[nops[i].bi] = "eq";
      i++;
      continue;
    }
    const dels = [];
    const inses = [];
    while (i < nops.length && nops[i].t !== "eq") {
      if (nops[i].t === "del") dels.push(nops[i].ai);
      else inses.push(nops[i].bi);
      i++;
    }
    const n = Math.min(dels.length, inses.length);
    for (let q = 0; q < n; q++) {
      statusA[dels[q]] = "mod";
      statusB[inses[q]] = "mod";
      const la = a[dels[q]];
      const lb = b[inses[q]];
      let s = null;
      if (wdBudget > 0 && la.length + lb.length <= WORD_MAX_LEN) {
        s = wordDiff(la, lb);
        if (s) {
          segsA[dels[q]] = s.aSegs;
          segsB[inses[q]] = s.bSegs;
          wdBudget--;
          for (const seg of s.aSegs) if (seg.kind === "eq") simMatched += 2 * seg.text.length;
        }
      }
      if (!s && simScan > 0) {
        simScan -= Math.min(la.length, lb.length);
        if (simScan >= 0) simMatched += 2 * commonEndsLen(la, lb);
        else simScan = 0;
      }
    }
    for (let q = n; q < dels.length; q++) statusA[dels[q]] = "del";
    for (let q = n; q < inses.length; q++) statusB[inses[q]] = "ins";
    removed += dels.length;
    added += inses.length;
    blocks.push({
      aLine: dels.length ? dels[0] : -1,
      bLine: inses.length ? inses[0] : -1,
      aCount: dels.length,
      bCount: inses.length,
    });
  }

  return {
    a, b, statusA, statusB, segsA, segsB, blocks,
    added, removed,
    sim: simTotal === 0 ? 100 : Math.round((simMatched / simTotal) * 1000) / 10,
    rough,
    elapsed: performance.now() - t0,
    unified: unifiedText(nops, a, b),
  };
}
/* __ENGINE_END__ */
