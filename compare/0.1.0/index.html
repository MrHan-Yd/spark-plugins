/* ---------- 纯 JS 增量 MD5（webview 无原生 MD5，分块读取大文件必需） ---------- */
const MD5_K = new Int32Array(64);
for (let i = 0; i < 64; i++) MD5_K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
const MD5_S = [
  7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
  5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
  4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
  6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21,
];

function md5New() {
  return { a0: 1732584193, b0: -271733879, c0: -1732584194, d0: 271733878, len: 0, buf: new Uint8Array(64), bl: 0 };
}

function md5Block(st, m, off) {
  const M = new Int32Array(16);
  for (let i = 0; i < 16; i++) {
    M[i] = m[off + i * 4] | (m[off + i * 4 + 1] << 8) | (m[off + i * 4 + 2] << 16) | (m[off + i * 4 + 3] << 24);
  }
  let A = st.a0, B = st.b0, C = st.c0, D = st.d0;
  for (let i = 0; i < 64; i++) {
    let F, g;
    if (i < 16) { F = (B & C) | (~B & D); g = i; }
    else if (i < 32) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
    else if (i < 48) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
    else { F = C ^ (B | ~D); g = (7 * i) % 16; }
    F = (F + A + MD5_K[i] + M[g]) | 0;
    const s = MD5_S[i];
    const nb = (B + ((F << s) | (F >>> (32 - s)))) | 0;
    A = D; D = C; C = B; B = nb;
  }
  st.a0 = (st.a0 + A) | 0;
  st.b0 = (st.b0 + B) | 0;
  st.c0 = (st.c0 + C) | 0;
  st.d0 = (st.d0 + D) | 0;
}

function md5Update(st, u8) {
  let i = 0;
  if (st.bl) {
    const take = Math.min(64 - st.bl, u8.length);
    st.buf.set(u8.subarray(0, take), st.bl);
    st.bl += take;
    i = take;
    if (st.bl === 64) { md5Block(st, st.buf, 0); st.bl = 0; }
  }
  for (; i + 64 <= u8.length; i += 64) md5Block(st, u8, i);
  if (i < u8.length) {
    st.buf.set(u8.subarray(i), 0);
    st.bl = u8.length - i;
  }
  st.len += u8.length;
}

function md5Hex(st) {
  const bitLen = st.len * 8;
  const padLen = st.bl < 56 ? 56 - st.bl : 120 - st.bl;
  const pad = new Uint8Array(padLen + 8);
  pad[0] = 0x80;
  const dv = new DataView(pad.buffer);
  dv.setUint32(padLen, bitLen >>> 0, true);
  dv.setUint32(padLen + 4, Math.floor(bitLen / 4294967296), true);
  md5Update(st, pad);
  let out = "";
  for (const v of [st.a0, st.b0, st.c0, st.d0]) {
    for (let i = 0; i < 4; i++) out += ((v >>> (i * 8)) & 255).toString(16).padStart(2, "0");
  }
  return out;
}
/* __MD5_END__ */

/* ---------- 通用工具 ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}

function formatSize(n) {
  if (n < 1024) return n + " B";
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
  return (n / 1024 / 1024).toFixed(1) + " MB";
}

function extOf(name) {
  const i = name.lastIndexOf(".");
  return i < 0 ? "" : name.slice(i + 1).toLowerCase();
}

function isImageFile(file) {
  if (file.type && file.type.startsWith("image/")) return true;
  return IMG_EXTS.has(extOf(file.name));
}

function isTextFile(file) {
  if (file.type && file.type.startsWith("text/")) return true;
  if (["application/json", "application/xml", "application/javascript", "application/x-yaml", "application/toml"].indexOf(file.type) >= 0) return true;
  return TEXT_EXTS.has(extOf(file.name));
}

function blobToArrayBuffer(blob) {
  if (blob.arrayBuffer) return blob.arrayBuffer();
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error || new Error("read fail"));
    r.readAsArrayBuffer(blob);
  });
}

function bufToHex(ab) {
  const u8 = new Uint8Array(ab);
  let out = "";
  for (let i = 0; i < u8.length; i++) out += u8[i].toString(16).padStart(2, "0");
  return out;
}

async function readClipboardText() {
  if (window.spark && spark.clipboard && spark.clipboard.readText) {
    try {
      const t = await spark.clipboard.readText();
      if (typeof t === "string") return t;
    } catch (_) {}
  }
  try { return await navigator.clipboard.readText(); } catch (_) {}
  return null;
}

async function copyText(text) {
  if (window.spark && spark.clipboard && spark.clipboard.writeText) {
    try { await spark.clipboard.writeText(text); return true; } catch (_) {}
  }
  try { await navigator.clipboard.writeText(text); return true; } catch (_) {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    ta.remove();
    return !!ok;
  } catch (_) { return false; }
}

function showToast(msg, isError) {
  $toast.textContent = msg;
  $toast.classList.toggle("error", !!isError);
  $toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => $toast.classList.remove("show"), 2200);
}

/* ---------- 文本模式：实时高亮渲染 ---------- */

// 收到一份 diff 结果后应用到界面（worker 回包或同步兜底共用）
function applyDiffResult(d) {
  lastDiffAt = performance.now();
  state.data = d;
  state.navIndex = -1;
  state.hlTruncated = 0;
  clearCurrent();
  renderBackdrop("left");
  renderBackdrop("right");
  renderStatus();
}

/* ---------- 异步 diff 调度 ----------
   computeDiff 全程在 Worker 里跑，主线程只收结果做渲染，输入不再被计算阻塞。
   在途期间又发生编辑时只记一个 dirty 标记，算完立即用最新值补算，不排队不积压。
   worker 构建/运行失败（如 CSP 限制）自动退回同步计算，功能不受影响。 */
let diffWorker = null;
let diffBroken = false;   // worker 失效 → 永久降级为同步
let diffBusy = false;     // 有计算在途
let diffDirty = false;    // 在途期间输入又变了
let diffInflight = null;  // 在途任务对应的输入快照
let lastDiffAt = 0;       // 界面上一次拿到结果的时间（输入节流用）

(function buildDiffWorker() {
  let src = null;
  try {
    for (const s of document.querySelectorAll("script")) {
      const t = s.textContent || "";
      if (t.indexOf("/* __ENGINE_BEGIN__ */") >= 0) { src = t; break; }
    }
    if (!src) return;
    const begin = src.indexOf("/* __ENGINE_BEGIN__ */");
    const end = src.indexOf("/* __ENGINE_END__ */");
    if (begin < 0 || end <= begin) return;
    const workerSrc =
      src.slice(begin, end) +
      "self.onmessage=function(e){var d=e.data;try{self.postMessage({res:computeDiff(d.a,d.b,d.o)})}" +
      "catch(err){self.postMessage({err:String((err&&err.message)||err)})}};";
    const w = new Worker(URL.createObjectURL(new Blob([workerSrc], { type: "application/javascript" })));
    w.onmessage = function (e) {
      diffBusy = false;
      const f = diffInflight;
      diffInflight = null;
      if (!f) return;
      if (e.data.err) { diffBroken = true; recomputeSync(); return; }
      const k = state.lastKey;
      const stale = diffDirty || !k || k.l !== f.l || k.r !== f.r || k.ws !== f.ws || k.cs !== f.cs;
      diffDirty = false;
      if (stale) { diffDispatch(); return; }
      applyDiffResult(e.data.res);
    };
    w.onerror = function () {
      diffBroken = true;
      try { w.terminate(); } catch (_) {}
      if (diffBusy) { diffBusy = false; diffInflight = null; diffDirty = false; recomputeSync(); }
    };
    diffWorker = w;
  } catch (_) { diffWorker = null; }
})();

function recomputeSync() {
  applyDiffResult(computeDiff($taLeft.value, $taRight.value, {
    ignoreWs: state.ignoreWs, ignoreCase: state.ignoreCase,
  }));
}

function diffDispatch() {
  lastDiffAt = performance.now();
  diffInflight = { l: $taLeft.value, r: $taRight.value, ws: state.ignoreWs, cs: state.ignoreCase };
  diffBusy = true;
  diffWorker.postMessage({
    a: diffInflight.l, b: diffInflight.r,
    o: { ignoreWs: state.ignoreWs, ignoreCase: state.ignoreCase },
  });
}

function recompute() {
  const l = $taLeft.value, r = $taRight.value;
  const k = state.lastKey;
  if (k && k.l === l && k.r === r && k.ws === state.ignoreWs && k.cs === state.ignoreCase) return;
  state.lastKey = { l, r, ws: state.ignoreWs, cs: state.ignoreCase };
  if (l === "" && r === "") {
    // 全空：本地直接出空结果，不等 worker 往返，高亮随删除即时消失
    diffBusy = false; diffInflight = null; diffDirty = false;
    applyDiffResult(computeDiff("", "", { ignoreWs: false, ignoreCase: false }));
    return;
  }
  if (!diffWorker || diffBroken) { recomputeSync(); return; }
  if (diffBusy) { diffDirty = true; return; }
  diffDispatch();
}

function renderBackdrop(side) {
  const d = state.data;
  const lines = side === "left" ? d.a : d.b;
  const status = side === "left" ? d.statusA : d.statusB;
  const segs = side === "left" ? d.segsA : d.segsB;
  const inner = side === "left" ? $hlLeftInner : $hlRightInner;
  const gut = side === "left" ? $gutLeftInner : $gutRightInner;
  const modCls = side === "left" ? "l-mod-l" : "l-mod-r";

  // —— 先构造块描述（不碰 DOM），块内容即复用 key ——
  // eq 区按 EQ_CHUNK 切片：编辑一处通常只落在其中一片
  const descs = [];
  const gdescs = [];
  const cap = Math.min(lines.length, HL_LINE_CAP);
  let i = 0;
  while (i < cap) {
    if (status[i] === "eq") {
      let j = i;
      while (j < cap && status[j] === "eq") j++;
      for (let s = i; s < j; s += EQ_CHUNK) {
        const e = Math.min(s + EQ_CHUNK, j);
        let text = "";
        for (let k = s; k < e; k++) {
          const t = lines[k];
          text += (k > s ? "\n" : "") + (t.length > 20000 ? t.slice(0, 20000) + " …" : t);
        }
        descs.push({ k: "e" + (e - s) + "\u0000" + text, eq: true, from: s, to: e });
        gdescs.push({ k: "g" + (s + 1) + ":" + e, num: true, from: s, to: e });
      }
      i = j;
      continue;
    }
    const st = status[i];
    let text = lines[i];
    if (text.length > 20000) text = text.slice(0, 20000) + " …";
    const sg = segs[i];
    let key;
    if (sg) {
      key = "l" + st + "\u0000S";
      for (const seg of sg) key += "\u0000" + seg.kind + "\u0001" + seg.text;
    } else {
      key = "l" + st + "\u0000T" + text;
    }
    descs.push({ k: key, eq: false, st, text, sg, idx: i });
    gdescs.push({ k: "gl" + st + ":" + (i + 1), num: false, st, n: i + 1 });
    i++;
  }

  // —— 按 key 复用上一轮的 DOM 节点：大文本编辑时绝大多数块原样保留，
  // 只重建真正变化的块，消除每次重算的全量重建与重排版卡顿 ——
  const take = (pool, k) => {
    const arr = pool.get(k);
    if (!arr || !arr.length) return null;
    const n = arr.pop();
    if (!arr.length) pool.delete(k);
    return n;
  };
  const bodyPool = new Map();
  for (const b of state.renderBlocks[side]) {
    const arr = bodyPool.get(b.k);
    if (arr) arr.push(b.el); else bodyPool.set(b.k, [b.el]);
  }
  const gutPool = new Map();
  for (const b of state.renderGut[side]) {
    const arr = gutPool.get(b.k);
    if (arr) arr.push(b.el); else gutPool.set(b.k, [b.el]);
  }

  const buildBody = (dsc) => {
    if (dsc.eq) {
      const run = el("div", "hl-run", dsc.text);
      run.style.height = (dsc.to - dsc.from) * ROW_H + "px";
      return run;
    }
    let cls = "hl-line";
    if (dsc.st === "del") cls = "hl-line l-del";
    else if (dsc.st === "ins") cls = "hl-line l-ins";
    else if (dsc.st === "mod") cls = "hl-line " + modCls;
    const line = el("div", cls);
    if (dsc.sg) {
      for (const seg of dsc.sg) {
        if (seg.kind === "eq") line.appendChild(document.createTextNode(seg.text));
        else line.appendChild(el("span", seg.kind === "del" ? "w-del" : "w-ins", seg.text));
      }
    } else if (dsc.text !== "") {
      line.textContent = dsc.text;
    }
    return line;
  };
  const buildGut = (dsc) => {
    if (dsc.num) {
      const nums = [];
      for (let k = dsc.from; k < dsc.to; k++) nums.push(k + 1);
      return document.createTextNode(nums.join("\n"));
    }
    return el("span", "gnum g-" + dsc.st, String(dsc.n));
  };

  const frag = document.createDocumentFragment();
  const gf = document.createDocumentFragment();
  const rowEls = new Array(cap);
  const newBlocks = [];
  const newGut = [];
  let gutSep = false;
  for (const dsc of descs) {
    const reused = take(bodyPool, dsc.k);
    const node = reused || buildBody(dsc);
    // 复用节点禁掉入场动画：内容没变就不重播淡入，只有真正新建（内容变了）才动效
    if (reused) node.style.animation = "none";
    frag.appendChild(node);
    newBlocks.push({ k: dsc.k, el: node });
    if (!dsc.eq) rowEls[dsc.idx] = node;
  }
  for (const dsc of gdescs) {
    if (gutSep) gf.appendChild(document.createTextNode("\n"));
    gutSep = true;
    const node = take(gutPool, dsc.k) || buildGut(dsc);
    gf.appendChild(node);
    newGut.push({ k: dsc.k, el: node });
  }

  inner.textContent = "";
  inner.appendChild(frag);
  gut.textContent = "";
  gut.appendChild(gf);
  state.renderBlocks[side] = newBlocks;
  state.renderGut[side] = newGut;
  state.rowEls[side] = rowEls;
  state.hlTruncated = Math.max(state.hlTruncated || 0, lines.length - cap);
  applyScrollTransform(side === "left" ? $taLeft : $taRight);
}

function applyScrollTransform(ta) {
  const left = ta === $taLeft;
  const inner = left ? $hlLeftInner : $hlRightInner;
  const gut = left ? $gutLeftInner : $gutRightInner;
  inner.style.transform = "translate(" + (-ta.scrollLeft) + "px," + (-ta.scrollTop) + "px)";
  gut.style.transform = "translateY(" + (-ta.scrollTop) + "px)";
}

let scrollGuard = false;
function wireScroll(ta, other) {
  ta.addEventListener("scroll", () => {
    applyScrollTransform(ta);
    if (!scrollGuard) {
      scrollGuard = true;
      other.scrollTop = ta.scrollTop;
      other.scrollLeft = ta.scrollLeft;
      applyScrollTransform(other);
      requestAnimationFrame(() => { scrollGuard = false; });
    }
  });
}

function clearCurrent() {
  for (const n of state.curMarks) n.classList.remove("cur");
  state.curMarks = [];
}

function markCurrent(blk) {
  clearCurrent();
  const mark = (els, start, count) => {
    if (start < 0) return;
    const end = Math.min(start + Math.max(1, count), els.length, start + 400);
    for (let i = start; i < end; i++) {
      const n = els[i];
      if (!n) continue;
      n.classList.add("cur");
      state.curMarks.push(n);
    }
  };
  mark(state.rowEls.left, blk.aLine, blk.aCount);
  mark(state.rowEls.right, blk.bLine, blk.bCount);
}

function gotoBlock(idx) {
  const d = state.data;
  if (!d || d.blocks.length === 0) return;
  const i = ((idx % d.blocks.length) + d.blocks.length) % d.blocks.length;
  state.navIndex = i;
  const blk = d.blocks[i];
  const align = (ta, line) => {
    if (line < 0) return;
    const max = Math.max(0, ta.scrollHeight - ta.clientHeight);
    ta.scrollTop = Math.min(max, Math.max(0, line * ROW_H - ta.clientHeight / 2 + ROW_H / 2));
  };
  align($taLeft, blk.aLine);
  align($taRight, blk.bLine);
  markCurrent(blk);
  $navPos.textContent = (i + 1) + "/" + d.blocks.length;
}

function navStep(dir) {
  const d = state.data;
  if (!d || d.blocks.length === 0) { showToast("暂无差异可跳转"); return; }
  const next = state.navIndex < 0 ? (dir > 0 ? 0 : d.blocks.length - 1) : state.navIndex + dir;
  gotoBlock(next);
}

function renderStatus() {
  const d = state.data;
  const notes = [];
  if (state.mode === "file") {
    renderFileStatus();
    return;
  }
  const hasL = $taLeft.value !== "";
  const hasR = $taRight.value !== "";
  const has = hasL || hasR;
  const blocks = d ? d.blocks.length : 0;
  $stAddBadge.hidden = false;
  $stDelBadge.hidden = false;
  $stSimBadge.hidden = false;
  if (d && has && blocks === 0) {
    $stVerdict.textContent = "✓ 内容完全一致";
    $stVerdict.className = "stat-tag";
    $stVerdict.style.color = "var(--ins-text)";
    $stVerdict.style.fontWeight = "600";
  } else {
    $stVerdict.textContent = (d ? blocks : 0) + " 处差异";
    $stVerdict.className = "stat-tag";
    $stVerdict.style.color = "";
    $stVerdict.style.fontWeight = "";
  }
  $stAddBadge.textContent = "+" + (d ? d.added : 0) + " 行";
  $stDelBadge.textContent = "−" + (d ? d.removed : 0) + " 行";
  const sim = d ? d.sim : 100;
  $stSimBadge.textContent = "相似度 " + (sim <= 0 ? "0" : sim >= 10 ? String(Math.round(sim)) : sim.toFixed(1)) + "%";
  if (!has) {
    $diffCount.hidden = true;
  } else if (blocks === 0) {
    $diffCount.hidden = false;
    $diffCount.className = "diff-count same";
    $diffCount.textContent = "✓ 内容一致";
  } else {
    $diffCount.hidden = false;
    $diffCount.className = "diff-count has";
    $diffCount.textContent = blocks + " 处差异";
  }
  $stLines.textContent = has ? "左 " + d.a.length + " 行 · 右 " + d.b.length + " 行" : "";
  if (d && d.rough) notes.push("内容过大，按整块对比");
  if (d && state.hlTruncated > 0) notes.push("内容过大，仅高亮前 " + HL_LINE_CAP + " 行");
  $stNote.textContent = notes.join(" · ");
  $navPill.hidden = !(has && d && blocks > 0);
  if ($navPill.hidden === false && state.navIndex < 0) $navPos.textContent = "1/" + blocks;
}

/* ---------- 文件模式 ---------- */
// 顶栏 pill 显隐动画：display:none 没有过渡，先加 .collapse 把宽度/边距/透明度压平，
// 过渡结束后再补 hidden（不残留 0 尺寸可聚焦的按钮）；展开时反向播放
function setPillCollapse(pill, hide) {
  clearTimeout(pill._collapseTimer);
  if (hide) {
    if (pill.hidden) return;
    pill._naturalW = pill.offsetWidth + 1;
    pill.style.maxWidth = pill._naturalW + "px";
    void pill.offsetWidth;  // 先提交自然宽度，再压向 0，过渡全程贴住内容不空转
    pill.style.maxWidth = "0px";
    pill.classList.add("collapse");
    pill._collapseTimer = setTimeout(() => { pill.hidden = true; }, 280);
  } else {
    if (pill.hidden) {
      pill.hidden = false;
      pill.style.maxWidth = "0px";
      void pill.offsetWidth;  // 以收起态先参与布局，展开才有过渡
    }
    if (pill._naturalW) pill.style.maxWidth = pill._naturalW + "px";
    pill.classList.remove("collapse");
  }
}

function setMode(mode) {
  state.mode = mode;
  $("modeText").classList.toggle("active", mode === "text");
  $("modeFile").classList.toggle("active", mode === "file");
  $textZone.hidden = mode !== "text";
  $fileZone.hidden = mode !== "file";
  setPillCollapse($("pillWs"), mode !== "text");
  setPillCollapse($("pillCase"), mode !== "text");
  $("btnCopyDiff").hidden = mode !== "text";
  $diffCount.hidden = mode !== "text";
  const zone = mode === "text" ? $textZone : $fileZone;
  zone.classList.remove("zone-in");
  void zone.offsetWidth;
  zone.classList.add("zone-in");
  if (mode === "file") renderFileResult();
  else renderStatus();
}

function stopBlink() {
  clearInterval(state.blinkTimer);
  state.blinkTimer = 0;
}

function clearImages() {
  stopBlink();
  state.imgReq++;  // 使仍在进行的图片加载请求失效
  if (state.img) {
    try { URL.revokeObjectURL(state.img.a.url); } catch (_) {}
    try { URL.revokeObjectURL(state.img.b.url); } catch (_) {}
  }
  state.img = null;
}

function setSlotFile(slot, file) {
  if (!file) return;
  if (file.size > MAX_HASH_BYTES) { showToast("文件超过 200MB，无法对比", true); return; }
  clearImages();
  state.files[slot] = {
    file,
    name: file.name,
    size: file.size,
    type: file.type || "",
    md5: null,
    sha1: null,
    sha256: null,
    shaSkipped: false,
    hashing: true,
    progress: 0,
    error: "",
  };
  renderSlots();
  renderFileResult();
  hashEntry(state.files[slot]);
}

async function hashEntry(e) {
  try {
    const st = md5New();
    for (let off = 0; off < e.size; off += HASH_CHUNK) {
      const buf = await blobToArrayBuffer(e.file.slice(off, Math.min(e.size, off + HASH_CHUNK)));
      md5Update(st, new Uint8Array(buf));
      e.progress = Math.min(1, (off + HASH_CHUNK) / e.size);
      renderSlots();
    }
    e.md5 = md5Hex(st);
    if (e.size <= SHA_WHOLE_LIMIT && window.crypto && crypto.subtle) {
      const whole = await blobToArrayBuffer(e.file);
      e.sha1 = bufToHex(await crypto.subtle.digest("SHA-1", whole));
      e.sha256 = bufToHex(await crypto.subtle.digest("SHA-256", whole));
    } else {
      e.shaSkipped = true;
    }
    e.hashing = false;
    e.progress = 1;
  } catch (err) {
    e.hashing = false;
    e.error = "哈希计算失败";
  }
  renderSlots();
  renderFileResult();
}

function slotEls(slot) {
  return slot === "A"
    ? { card: $("slotA"), box: $("fileA"), icon: $("sfIconA"), name: $("sfNameA"), info: $("sfInfoA"), prog: $("sfProgA"), bar: $("sfBarA") }
    : { card: $("slotB"), box: $("fileB"), icon: $("sfIconB"), name: $("sfNameB"), info: $("sfInfoB"), prog: $("sfProgB"), bar: $("sfBarB") };
}

function renderSlots() {
  for (const slot of ["A", "B"]) {
    const e = state.files[slot];
    const n = slotEls(slot);
    n.card.classList.toggle("filled", !!e);
    n.box.hidden = !e;
    if (e) {
      n.icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>';
      n.name.textContent = e.name;
      n.name.title = e.name;
      n.info.textContent = formatSize(e.size) + (e.type ? " · " + e.type : "") + (e.hashing ? " · 计算哈希中…" : (e.error ? " · " + e.error : ""));
      n.prog.hidden = !e.hashing;
      n.bar.style.width = Math.round(e.progress * 100) + "%";
    }
  }
}

function clearSlot(slot) {
  clearImages();
  state.files[slot] = null;
  renderSlots();
  renderFileResult();
}

function filesComplete() {
  const A = state.files.A, B = state.files.B;
  return A && B && !A.hashing && !B.hashing && !A.error && !B.error;
}

function renderFileStatus() {
  const A = state.files.A, B = state.files.B;
  $stAddBadge.hidden = true;
  $stDelBadge.hidden = true;
  $stSimBadge.hidden = true;
  $stLines.textContent = "";
  if (!A && !B) { $stVerdict.textContent = "选择文件后自动对比"; return; }
  if (!A || !B) { $stVerdict.textContent = "已选择 " + ((A ? 1 : 0) + (B ? 1 : 0)) + "/2 个文件"; return; }
  if (A.hashing || B.hashing) { $stVerdict.textContent = "正在计算哈希…"; return; }
  if (A.error || B.error) { $stVerdict.textContent = "哈希计算失败"; return; }
  if (A.size === B.size && A.md5 === B.md5) $stVerdict.textContent = "✓ 两个文件完全相同";
  else $stVerdict.textContent = "两个文件不同";
}

async function renderFileResult() {
  renderFileStatus();
  const A = state.files.A, B = state.files.B;
  const panel = $("fileResult");
  if (!A || !B) { panel.hidden = true; return; }
  panel.hidden = false;

  const vd = $("verdict");
  vd.className = "verdict neutral";
  if (A.hashing || B.hashing) {
    vd.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg><span>正在计算哈希…（大文件需要几秒）</span>';
  } else if (A.error || B.error) {
    vd.classList.add("bad");
    vd.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><span>哈希计算失败，请重试</span>';
  } else {
    const same = A.size === B.size && A.md5 === B.md5;
    vd.classList.add(same ? "ok" : "bad");
    const sub = same
      ? "大小与 MD5 均一致"
      : (A.size !== B.size ? "大小不同（" + formatSize(A.size) + " vs " + formatSize(B.size) + "）" : "大小相同，但内容哈希不同");
    vd.innerHTML = (same
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M15 9l-6 6M9 9l6 6"/></svg>')
      + "<span><b>" + (same ? "两个文件完全相同" : "两个文件不同") + "</b>　" + sub + "</span>";
  }

  renderHashRows();

  const bothImg = isImageFile(A.file) && isImageFile(B.file) && A.size <= MAX_IMG_BYTES && B.size <= MAX_IMG_BYTES;
  const bothText = !bothImg && isTextFile(A.file) && isTextFile(B.file) && A.size <= MAX_TEXT_BYTES && B.size <= MAX_TEXT_BYTES;
  $("imgPanel").hidden = !bothImg;
  $("textBridge").hidden = !bothText;

  if (bothImg && filesComplete()) {
    const req = ++state.imgReq;
    try {
      const [ia, ib] = await Promise.all([loadImageEl(A.file), loadImageEl(B.file)]);
      if (req !== state.imgReq) {
        try { URL.revokeObjectURL(ia.url); } catch (_) {}
        try { URL.revokeObjectURL(ib.url); } catch (_) {}
        return;
      }
      if (state.img) {
        try { URL.revokeObjectURL(state.img.a.url); } catch (_) {}
        try { URL.revokeObjectURL(state.img.b.url); } catch (_) {}
      }
      state.img = { a: ia, b: ib };
      applyImgMode();
    } catch (err) {
      $("imgMeta").innerHTML = '<span class="img-warn">图片解码失败：' + (err && err.message ? err.message : "格式不受支持") + "</span>";
      $("imgStage").innerHTML = "";
    }
  }
}

function renderHashRows() {
  const A = state.files.A, B = state.files.B;
  const box = $("hashRows");
  box.textContent = "";
  const mk = (alg, va, vb, ok) => {
    const row = el("div", "hash-row");
    row.title = "点击复制 " + alg;
    const mark = el("span", "hash-mark " + (ok == null ? "na" : ok ? "match" : "miss"), ok == null ? "–" : ok ? "✓" : "✗");
    const val = el("span", "hash-val");
    val.textContent = va == null ? "（未计算）" : va;
    if (va && vb && va !== vb) val.title = "B: " + vb;
    row.append(el("span", "hash-alg", alg), val, mark);
    row.addEventListener("click", async () => {
      if (!va) return;
      const okc = await copyText(va);
      showToast(okc ? "已复制 " + alg : "复制失败", !okc);
    });
    return row;
  };
  const alg = (e, k) => (e && !e.hashing && !e.error ? e[k] : null);
  box.append(
    mk("MD5", A.md5, B.md5, A.md5 && B.md5 ? A.md5 === B.md5 : null),
    mk("SHA-1", A.sha1, B.sha1, A.sha1 && B.sha1 ? A.sha1 === B.sha1 : null),
    mk("SHA-256", A.sha256, B.sha256, A.sha256 && B.sha256 ? A.sha256 === B.sha256 : null)
  );
  if ((A.shaSkipped || B.shaSkipped) && !(A.sha1 && B.sha1)) {
    const note = el("div", "st-note");
    note.style.fontSize = "11px";
    note.textContent = "文件超过 64MB，SHA-1 / SHA-256 已跳过（MD5 为流式计算不受影响）";
    box.appendChild(note);
  }
}

function loadImageEl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => resolve({ el: img, url, w: img.naturalWidth, h: img.naturalHeight });
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("格式不受支持或文件损坏")); };
    img.src = url;
  });
}

function applyImgMode() {
  const stg = $("imgStage");
  stopBlink();
  stg.innerHTML = "";
  stg.className = "img-stage checker";
  const mode = state.imgMode;
  document.querySelectorAll("#imgModes button").forEach((b) => b.classList.toggle("active", b.dataset.m === state.imgMode));
  buildImgCtl();

  if (!state.img) return;
  const { a, b } = state.img;

  if (state.imgMode === "side") {
    const pA = el("div", "img-pane");
    const pB = el("div", "img-pane");
    pA.append(el("span", "pane-tag", "A"));
    pB.append(el("span", "pane-tag", "B"));
    const iA = new Image(); iA.src = a.url;
    const iB = new Image(); iB.src = b.url;
    pA.appendChild(iA);
    pB.appendChild(iB);
    stg.append(pA, pB);
    renderImgMeta();
  } else if (state.imgMode === "stack") {
    stg.className = "img-stage " + (state.stackBlend === "difference" ? "black" : "checker");
    const wrap = el("div", "img-stack" + (state.stackBlend === "difference" ? " blend" : ""));
    const iA = new Image(); iA.src = a.url;
    const iB = new Image(); iB.src = b.url; iB.className = "top";
    iB.style.opacity = String(state.stackOp / 100);
    wrap.append(iA, iB);
    stg.appendChild(wrap);
    renderImgMeta();
  } else if (state.imgMode === "blink") {
    stg.className = "img-stage checker";
    const wrap = el("div", "img-stack");
    const iA = new Image(); iA.src = a.url;
    const iB = new Image(); iB.src = b.url; iB.className = "top";
    wrap.append(iA, iB);
    stg.appendChild(wrap);
    startBlink(iB);
    renderImgMeta();
  } else if (state.imgMode === "diff") {
    renderPixelDiff();
  }
}

function startBlink(imgB) {
  state.blinkTimer = setInterval(() => {
    imgB.style.visibility = imgB.style.visibility === "hidden" ? "visible" : "hidden";
  }, 600);
}

function renderImgMeta(extra) {
  if (!state.img) { $("imgMeta").textContent = ""; return; }
  const { a, b } = state.img;
  const dimSame = a.w === b.w && a.h === b.h;
  let html = "A " + a.w + "×" + a.h + " · B " + b.w + "×" + b.h + " · " + formatSize(state.files.A.size) + " / " + formatSize(state.files.B.size);
  if (!dimSame) html += '　<span class="img-warn">⚠ 两图尺寸不同，堆叠/差异按左上角对齐取重叠区域</span>';
  if (extra) html += "　" + extra;
  $("imgMeta").innerHTML = html;
}

function renderPixelDiff() {
  const { a, b } = state.img;
  const stg = $("imgStage");
  stg.className = "img-stage checker";
  stg.innerHTML = "";
  const w = Math.min(a.w, b.w);
  const h = Math.min(a.h, b.h);
  const scale = Math.min(1, IMG_PIXEL_CAP / Math.max(w, h, 1));
  const cw = Math.max(1, Math.round(w * scale));
  const ch = Math.max(1, Math.round(h * scale));
  const cA = document.createElement("canvas"); cA.width = cw; cA.height = ch;
  const cB = document.createElement("canvas"); cB.width = cw; cB.height = ch;
  const xA = cA.getContext("2d", { willReadFrequently: true });
  const xB = cB.getContext("2d", { willReadFrequently: true });
  xA.drawImage(a.el, 0, 0, cw, ch);
  xB.drawImage(b.el, 0, 0, cw, ch);
  const dA = xA.getImageData(0, 0, cw, ch).data;
  const dB = xB.getImageData(0, 0, cw, ch).data;
  const out = xA.createImageData(cw, ch);
  const od = out.data;
  const tol = state.diffTol;
  let diffCount = 0;
  for (let i = 0; i < dA.length; i += 4) {
    const dr = Math.abs(dA[i] - dB[i]);
    const dg = Math.abs(dA[i + 1] - dB[i + 1]);
    const db = Math.abs(dA[i + 2] - dB[i + 2]);
    const da = Math.abs(dA[i + 3] - dB[i + 3]);
    const d = Math.max(dr, dg, db, da);
    if (d > tol) {
      diffCount++;
      const k = i + 1;
      od[i] = 255; od[k] = 45; od[k + 1] = 85;
      od[k + 2] = 90 + Math.round(165 * (d / 255));
    } else {
      const g = 26;
      od[i] = g; od[i + 1] = g + 3; od[i + 2] = g + 8; od[i + 3] = 255;
    }
  }
  xA.putImageData(out, 0, 0);
  const view = document.createElement("canvas");
  view.width = cw; view.height = ch;
  view.getContext("2d").drawImage(cA, 0, 0);
  view.className = "img-diff";
  stg.innerHTML = "";
  stg.appendChild(view);
  const total = cw * ch;
  const pct = total ? ((diffCount / total) * 100).toFixed(2) : "0.00";
  const stats = '差异像素 ' + diffCount.toLocaleString() + " / " + total.toLocaleString() + "（" + pct + "%）· 容差 " + tol;
  renderImgMeta(stats + (scale < 1 ? " · 已缩放至 " + cw + "×" + ch : ""));
}

function buildImgCtl() {
  const ctl = $("imgCtl");
  ctl.textContent = "";
  if (state.imgMode === "stack") {
    const lbl = el("span", null, "顶层不透明度");
    const range = el("input");
    range.type = "range"; range.min = "0"; range.max = "100"; range.value = String(state.stackOp);
    range.addEventListener("input", () => {
      state.stackOp = Number(range.value);
      const top = $("imgStage").querySelector("img.top");
      if (top) top.style.opacity = String(state.stackOp / 100);
    });
    const blend = el("select");
    for (const [v, t] of [["normal", "正常混合"], ["difference", "差值模式（相同处变黑）"]]) {
      const o = el("option", null, t);
      o.value = v;
      if (v === state.stackBlend) o.selected = true;
      blend.appendChild(o);
    }
    blend.addEventListener("change", () => { state.stackBlend = blend.value; applyImgMode(); });
    ctl.append(lbl, range, blend);
  } else if (state.imgMode === "blink") {
    const btn = el("button", state.blinkTimer ? "pill on" : "pill");
    btn.innerHTML = '<span class="pill-dot"></span><span>' + (state.blinkTimer ? "暂停" : "播放") + "</span>";
    btn.addEventListener("click", () => {
      if (state.blinkTimer) {
        stopBlink();
        const top = $("imgStage").querySelector("img.top");
        if (top) top.style.visibility = "visible";
      } else {
        const top = $("imgStage").querySelector("img.top");
        if (top) startBlink(top);
      }
      buildImgCtl();
    });
    const tip = el("span", null, "每 0.6s 在 A / B 间切换，肉眼捕捉差异区域");
    ctl.append(btn, tip);
  } else if (state.imgMode === "diff") {
    const lbl = el("span", null, "容差");
    const sel = el("select");
    for (const v of [0, 5, 15, 30, 60]) {
      const o = el("option", null, String(v));
      o.value = String(v);
      if (v === state.diffTol) o.selected = true;
      sel.appendChild(o);
    }
    sel.addEventListener("change", () => { state.diffTol = Number(sel.value); renderPixelDiff(); });
    const tip = el("span", null, "容差可过滤 JPEG 压缩噪声，仅保留真实差异");
    ctl.append(lbl, sel, tip);
  }
}

/* ---------- 事件 ---------- */
function setViewPills() {
  $("pillWs").classList.toggle("on", state.ignoreWs);
  $("pillCase").classList.toggle("on", state.ignoreCase);
}

function setFileChip(side, name) {
  state.fileNames[side] = name || "";
  const chip = side === "left" ? $chipLeft : $chipRight;
  if (name) {
    chip.querySelector(".chip-name").textContent = name;
    chip.title = name + "（点击清除标记）";
    chip.hidden = false;
  } else {
    chip.hidden = true;
  }
}

function readFileInto(side, file) {
  if (!file) return;
  if (file.size > MAX_TEXT_BYTES) { showToast("文件过大（超过 10MB），未载入", true); return; }
  if (isImageFile(file)) { showToast("图片请切换到「文件 / 图片」标签对比", true); return; }
  if (file.type && !file.type.startsWith("text/") && !isTextFile(file)) {
    showToast("检测到二进制文件，请切换到「文件 / 图片」标签对比", true);
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    const ta = side === "left" ? $taLeft : $taRight;
    ta.value = String(reader.result || "");
    setFileChip(side, file.name);
    recompute();
    showToast("已导入 " + file.name + "（" + formatSize(file.size) + "）");
  };
  reader.onerror = () => showToast("文件读取失败", true);
  reader.readAsText(file);
}

async function fillFromClipboard(side) {
  const text = await readClipboardText();
  if (text == null) { showToast("无法读取系统剪贴板", true); return; }
  if (text === "") { showToast("剪贴板中无内容"); return; }
  const ta = side === "left" ? $taLeft : $taRight;
  ta.value = text;
  setFileChip(side, "");
  recompute();
  showToast("已导入剪贴板至" + (side === "left" ? "左侧" : "右侧"));
}

function clearAll() {
  $taLeft.value = "";
  $taRight.value = "";
  setFileChip("left", "");
  setFileChip("right", "");
  state.files = { A: null, B: null };
  clearImages();
  renderSlots();
  recompute();
  renderFileResult();
  showToast("已清空所有内容");
}

async function swapSides() {
  if (state.mode === "file") {
    const t = state.files.A;
    state.files.A = state.files.B;
    state.files.B = t;
    clearImages();
    renderSlots();
    renderFileResult();
    showToast("已对调两个文件");
    return;
  }
  const l = $taLeft.value;
  $taLeft.value = $taRight.value;
  $taRight.value = l;
  const fn = state.fileNames.left;
  setFileChip("left", state.fileNames.right);
  setFileChip("right", fn);
  recompute();
  showToast("已对调两侧内容");
}

function loadUiState() {
  let ui = null;
  try { ui = JSON.parse(localStorage.getItem("spark_compare_ui") || "null"); } catch (_) {}
  if (ui && typeof ui.split === "number" && ui.split >= 0.15 && ui.split <= 0.85) {
    $("paneLeft").style.flex = "0 0 " + (ui.split * 100) + "%";
  }
}

function saveUiState() {
  try {
    localStorage.setItem("spark_compare_ui", JSON.stringify({
      split: $("paneLeft").offsetWidth / Math.max(1, $textZone.offsetWidth),
    }));
  } catch (_) {}
}

function setupGripV() {
  $gripV.addEventListener("mousedown", (e) => {
    const rect = $textZone.getBoundingClientRect();
    document.body.classList.add("resizing-col");
    const onMove = (ev) => {
      let pct = (ev.clientX - rect.left) / rect.width;
      pct = Math.min(0.85, Math.max(0.15, pct));
      $("paneLeft").style.flex = "0 0 " + (pct * 100) + "%";
    };
    const onUp = () => {
      document.body.classList.remove("resizing-col");
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup", onUp);
      saveUiState();
    };
    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup", onUp);
  });
  $gripV.addEventListener("dblclick", () => {
    $("paneLeft").style.flex = "";
    saveUiState();
  });
}

function wireEvents() {
  let timer = 0;
  const onEdit = () => {
    // 全部清空时立即重算：高亮随删除同步消失，不留残影
    if ($taLeft.value === "" && $taRight.value === "") { clearTimeout(timer); recompute(); return; }
    // 节流+尾随：逐字慢速输入时每次按键都立即刷新（计算在 Worker，不占输入线程），
    // 快速连打时每 ~120ms 用最新内容跟一次，停手后必有收尾，高亮贴手不迟滞
    clearTimeout(timer);
    const since = performance.now() - lastDiffAt;
    if (since >= 120) recompute();
    else timer = setTimeout(recompute, 130 - since);
  };
  $taLeft.addEventListener("input", onEdit);
  $taRight.addEventListener("input", onEdit);

  for (const ta of [$taLeft, $taRight]) {
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.metaKey) {
        e.preventDefault();
        const s = ta.selectionStart;
        const epos = ta.selectionEnd;
        ta.value = ta.value.slice(0, s) + "  " + ta.value.slice(epos);
        ta.selectionStart = ta.selectionEnd = s + 2;
        onEdit();
      }
    });
  }
  wireScrollPair();

  $("modeText").addEventListener("click", () => setMode("text"));
  $("modeFile").addEventListener("click", () => setMode("file"));

  $("pillWs").addEventListener("click", () => { state.ignoreWs = !state.ignoreWs; setViewPills(); recompute(); });
  $("pillCase").addEventListener("click", () => { state.ignoreCase = !state.ignoreCase; setViewPills(); recompute(); });

  $("btnSwap").addEventListener("click", swapSides);
  $("btnClear").addEventListener("click", clearAll);

  $("btnCopyDiff").addEventListener("click", async () => {
    const d = state.data;
    if (!d || d.blocks.length === 0) { showToast("当前无差异文本可复制"); return; }
    const ok = await copyText(d.unified);
    showToast(ok ? "已复制差异补丁（" + d.unified.length + " 字符）" : "复制失败", !ok);
  });

  $("btnTheme").addEventListener("click", () => {
    setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  });

  document.querySelectorAll(".mini-btn").forEach((btn) => {
    btn.addEventListener("click", () => fillFromClipboard(btn.dataset.side));
  });

  $chipLeft.addEventListener("click", () => setFileChip("left", ""));
  $chipRight.addEventListener("click", () => setFileChip("right", ""));

  // 文件模式：槽位点击 / 拖拽
  $slotInput.addEventListener("change", () => {
    const f = $slotInput.files && $slotInput.files[0];
    if (f && state.fileSlot) setSlotFile(state.fileSlot, f);
    $slotInput.value = "";
  });
  for (const slot of ["A", "B"]) {
    const card = $("slot" + slot);
    card.addEventListener("click", (e) => {
      if (e.target.closest(".sf-x")) return;
      state.fileSlot = slot;
      $slotInput.click();
    });
    $("sfX" + slot).addEventListener("click", (e) => {
      e.stopPropagation();
      clearSlot(slot);
    });
    card.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.stopPropagation();
      e.dataTransfer.dropEffect = "copy";
      card.classList.add("dropping");
    });
    card.addEventListener("dragleave", (e) => {
      if (!card.contains(e.relatedTarget)) card.classList.remove("dropping");
    });
    card.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      card.classList.remove("dropping");
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) setSlotFile(slot, f);
    });
  }
  $("slots").addEventListener("drop", (e) => {
    e.preventDefault();
    const fs = e.dataTransfer.files;
    if (!fs || !fs.length) return;
    if (fs.length >= 2) { setSlotFile("A", fs[0]); setSlotFile("B", fs[1]); }
    else {
      const empty = !state.files.A ? "A" : (!state.files.B ? "B" : "A");
      setSlotFile(empty, fs[0]);
    }
  });

  $("imgModes").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-m]");
    if (!btn) return;
    state.imgMode = btn.dataset.m;
    applyImgMode();
  });

  $("btnOpenText").addEventListener("click", async () => {
    const A = state.files.A, B = state.files.B;
    if (!A || !B) return;
    try {
      const [ta, tb] = await Promise.all([blobText(A.file), blobText(B.file)]);
      $taLeft.value = ta;
      $taRight.value = tb;
      setFileChip("left", A.name);
      setFileChip("right", B.name);
      setMode("text");
      recompute();
    } catch (_) {
      showToast("文件读取失败", true);
    }
  });

  // 文本编辑区拖拽
  for (const pane of [$("paneLeft"), $("paneRight")]) {
    pane.addEventListener("dragover", (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
      pane.classList.add("dropping");
    });
    pane.addEventListener("dragleave", (e) => {
      if (!pane.contains(e.relatedTarget)) pane.classList.remove("dropping");
    });
    pane.addEventListener("drop", (e) => {
      e.preventDefault();
      e.stopPropagation();
      pane.classList.remove("dropping");
      const f = e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) readFileInto(pane.dataset.side, f);
    });
  }

  // 全局兜底：文本模式下直接拖 2 个文件 = 左右各一
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    const fs = e.dataTransfer && e.dataTransfer.files;
    if (!fs || !fs.length) return;
    if (state.mode === "file") {
      if (fs.length >= 2) { setSlotFile("A", fs[0]); setSlotFile("B", fs[1]); }
      else {
        const empty = !state.files.A ? "A" : (!state.files.B ? "B" : "A");
        setSlotFile(empty, fs[0]);
      }
    } else {
      if (fs.length >= 2) { readFileInto("left", fs[0]); readFileInto("right", fs[1]); }
      else readFileInto($taLeft.value ? "right" : "left", fs[0]);
    }
  });

  $("navPrev").addEventListener("click", () => navStep(-1));
  $("navNext").addEventListener("click", () => navStep(1));
  $diffCount.addEventListener("click", () => navStep(1));
  document.addEventListener("keydown", (e) => {
    if (e.altKey && e.key === "ArrowDown") { e.preventDefault(); navStep(1); }
    else if (e.altKey && e.key === "ArrowUp") { e.preventDefault(); navStep(-1); }
  });

  setupGripV();
}

function wireScrollPair() {
  wireScroll($taLeft, $taRight);
  wireScroll($taRight, $taLeft);
  applyScrollTransform($taLeft);
  applyScrollTransform($taRight);
}

function blobText(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result || ""));
    r.onerror = () => reject(r.error);
    r.readAsText(file);
  });
}

/* ---------- 启动 ---------- */
(function init() {
  wireEvents();
  loadUiState();
  const inputFromSpark = (window.spark && spark.input && spark.input.text) || "";
  if (inputFromSpark) $taLeft.value = inputFromSpark;
  setMode("text");
  recompute();
  renderSlots();
  if (!$taLeft.value) $taLeft.focus();
})();
</script>
</body>
</html>
