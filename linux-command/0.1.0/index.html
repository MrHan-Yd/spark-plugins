<!doctype html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Linux 命令查询</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <i class="ic ic-prompt" aria-hidden="true"></i>
      <span>Linux 命令查询</span>
    </div>
    <div class="search">
      <i class="ic ic-search" aria-hidden="true"></i>
      <input id="q" type="search" aria-label="搜索命令" placeholder="搜索命令名 / 拼音 / 描述…"
             autocomplete="off" spellcheck="false">
      <button id="btn-clr" class="clr" type="button" aria-label="清除搜索" hidden><i class="ic ic-x"></i></button>
      <span class="kb" id="kb-slash" aria-hidden="true">/</span>
    </div>
    <button id="scope-chip" class="scope-chip" type="button" hidden>
      <span id="scope-label"></span><i class="ic ic-x"></i>
    </button>
    <button id="btn-theme" class="icon-btn" type="button" aria-label="切换明暗主题" title="切换明暗主题"><i class="ic"></i></button>
  </header>

  <main class="main">
    <section class="list-pane">
      <div class="filters">
        <div class="alpha-row">
          <div class="alpha" id="alpha" role="group" aria-label="按首字母过滤"></div>
          <button id="btn-favs" class="fav-toggle" type="button" aria-label="只看收藏"
                  aria-pressed="false" title="只看收藏"><i class="ic ic-star"></i></button>
        </div>
      </div>
      <div class="list" id="list" role="list" aria-label="命令列表">
        <div class="empty" id="list-empty" hidden></div>
        <div class="sentinel" id="sentinel" hidden></div>
      </div>
    </section>

    <section class="doc-pane" id="doc-pane">
      <header class="doc-head" id="doc-head" hidden>
        <div class="in">
          <button id="btn-back" class="back" type="button" aria-label="返回列表"><i class="ic ic-back"></i></button>
          <h1 class="doc-title" id="doc-title"></h1>
          <div class="doc-acts">
            <button id="btn-copy-cmd" class="act" type="button" aria-label="复制命令名" title="复制命令名"><i class="ic ic-copy"></i></button>
            <button id="btn-star" class="act" type="button" aria-label="收藏" title="收藏"><i class="ic ic-star"></i></button>
          </div>
        </div>
      </header>
      <div class="doc-scroll" id="doc-scroll">
        <div class="rail" id="rail">
          <div class="doc-idle" id="doc-idle">
            <i class="ic ic-keyboard" aria-hidden="true"></i>
            <div class="empty-t">搜索，或从左侧选择命令</div>
            <div class="empty-s"><kbd>/</kbd> 聚焦搜索 · <kbd>↑</kbd><kbd>↓</kbd> 选择 · <kbd>Enter</kbd> 打开</div>
          </div>
          <div class="doc-empty" id="doc-empty" hidden></div>
          <div class="skel" id="skel" hidden>
            <span class="sk sk-t"></span><span class="sk sk-l"></span><span class="sk sk-l w92"></span>
            <span class="sk sk-l w76"></span><span class="sk sk-code"></span><span class="sk sk-l"></span><span class="sk sk-l w92"></span>
          </div>
          <nav class="toc" id="toc" hidden>
            <button class="toc-sum" id="toc-sum" type="button" aria-expanded="false">
              <i class="ic ic-chev"></i><span>本页目录</span><em id="toc-count"></em>
            </button>
            <div class="toc-wrap" id="toc-wrap"><ol class="toc-list" id="toc-list"></ol></div>
          </nav>
          <article class="md" id="md" aria-labelledby="doc-title" hidden></article>
        </div>
      </div>
    </section>
  </main>

  <footer class="foot">
    <div class="src">
      <i class="dot" id="src-dot"></i><span id="src-text"></span>
      <button id="btn-restore" class="lnk" type="button" hidden>恢复出厂</button>
    </div>
    <div class="upd">
      <button id="btn-upd" class="btn-upd" type="button"><i class="ic ic-refresh"></i><span>检查更新</span></button>
      <span class="prog" id="upd-prog" hidden>
        <span class="prog-track"><span class="prog-fill" id="prog-fill"></span></span>
        <span id="prog-text"></span>
      </span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/vendor/purify.min.js"></script>
  <script src="assets/vendor/highlight.min.js"></script>
  <script src="data/index.js"></script>
  <script src="engine.js"></script>
  <script src="list.js"></script>
  <script src="doc.js"></script>
  <script src="updater.js"></script>
  <script src="app.js"></script>
</body>
</html>
