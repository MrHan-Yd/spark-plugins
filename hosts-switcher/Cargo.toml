[package]
name = "spark-plugin-hosts-switcher"
version = "0.1.0"
edition = "2021"
description = "Spark native 插件:Hosts 切换(多方案合并写入系统 hosts)"

[[bin]]
name = "spark-plugin-hosts-switcher"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true