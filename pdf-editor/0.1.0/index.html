<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PDF编辑器</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
    <linearGradient id="logo-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E7490"/><stop offset="1" stop-color="#155E75"/>
    </linearGradient>
  </defs></svg>

  <!-- ① 顶栏 -->
  <header id="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" width="24" height="24"><rect x="4" y="2" width="13" height="20" rx="2" fill="url(#logo-g)"/><path d="M8 8h6M8 12h6M8 16h4" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="18.5" cy="18.5" r="4.5" fill="#fff" stroke="#0E7490" stroke-width="1.4"/><path d="M16.5 18.5h4M18.5 16.5v4" stroke="#0E7490" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span id="doc-header" class="doc-header hidden"><span id="doc-name"></span><span id="save-dot" class="save-dot"></span></span>
    </div>
    <nav class="tabs">
      <button class="tab tab-active" data-mode="view">开始</button>
      <button class="tab" data-mode="text">文本</button>
      <button class="tab" data-mode="shape">图形</button>
      <button class="tab" data-mode="page">页面</button>
    </nav>
    <div class="tool-group">
      <button id="btn-text" class="tbtn" title="插入文本框">文本框</button>
      <button id="btn-whiteout" class="tbtn" title="白盒遮盖原文">白盒</button>
      <button id="btn-highlight" class="tbtn" title="高亮">高亮</button>
      <button id="btn-image" class="tbtn" title="插入图片">图片</button>
    </div>
    <div class="spacer"></div>
    <div class="actions">
      <button id="btn-undo" class="iconbtn" title="撤销 (Ctrl+Z)" disabled>↶</button>
      <button id="btn-redo" class="iconbtn" title="重做 (Ctrl+Y)" disabled>↷</button>
      <button id="btn-save" class="btn-primary" title="保存 (Ctrl+S 另存)">保存</button>
      <button id="btn-close" class="iconbtn" title="关闭">─</button>
    </div>
  </header>

  <div id="main">
    <!-- ② 页面缩略图导航 -->
    <aside id="thumbs-panel"><div id="thumbs"></div></aside>

    <!-- ③ 文档画布 -->
    <main id="canvas-scroll">
      <div id="pages-layer"></div>
      <!-- 空状态（无文件首页） -->
      <div id="empty-state">
        <div class="empty-card">
          <svg viewBox="0 0 72 72" width="72" height="72"><rect x="14" y="8" width="34" height="52" rx="4" fill="#fff" stroke="#0E7490" stroke-width="2"/><path d="M22 22h18M22 30h18M22 38h12" stroke="#0E7490" stroke-width="2" stroke-linecap="round" opacity=".55"/><path d="M48 46c6-2 10 2 8 8-1.6 4.8-8 6-12 4-3.2-1.8-3-6 0-7.4 2.6-1.2 6 0 6.4 2.8" stroke="#0E7490" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
          <div class="empty-title">打开一份 PDF 开始编辑</div>
          <div class="empty-sub">改字 · 贴图 · 高亮 · 页面编排，全程本地处理</div>
          <button id="btn-open" class="btn-primary btn-block">打开 PDF…</button>
          <div class="dropzone" id="dropzone">或将 PDF 文件拖到这里</div>
          <div id="recent-list"></div>
        </div>
      </div>
      <!-- regex 路径引导卡（需选择确认，不承诺直开） -->
      <div id="open-guide" class="empty-card hidden">
        <div class="empty-title">待打开</div>
        <div class="guide-path mono"></div>
        <div class="empty-sub">出于文件安全，需在系统对话框中选择确认该文件</div>
        <button id="guide-open-btn" class="btn-primary btn-block">选择文件…</button>
      </div>
    </main>

    <!-- ④ 属性面板（P0 精简版） -->
    <aside id="props-panel"><div id="props-body"></div></aside>
  </div>

  <!-- ⑤ 状态栏 -->
  <footer id="statusbar">
    <span id="page-indicator" class="mono">未打开文档</span>
    <div class="spacer"></div>
    <button id="zoom-out" class="iconbtn" title="缩小">−</button>
    <span id="zoom-value" class="mono">100%</span>
    <button id="zoom-in" class="iconbtn" title="放大">＋</button>
    <button id="zoom-fit" class="iconbtn" title="适应页宽 (Ctrl+0)">⇔</button>
    <span id="save-status" class="save-status">—</span>
  </footer>

  <!-- 保存进度弹层 -->
  <div id="save-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">正在保存…</div>
      <div class="spinner"></div>
      <div class="modal-sub">合成 PDF 并写入文件</div>
    </div>
  </div>

  <div id="toast"></div>
  <input type="file" id="file-input" accept="application/pdf,.pdf" hidden>

  <script src="assets/vendor/pdf.min.js"></script>
  <script src="assets/vendor/pdf-lib.min.js"></script>
  <script src="assets/vendor/fontkit.umd.min.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/model.js"></script>
  <script src="js/history.js"></script>
  <script src="js/store.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/render.js"></script>
  <script src="js/overlay-view.js"></script>
  <script src="js/interact.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/export.js"></script>
  <script src="js/shell.js"></script>
  <script>
    (function () {
      'use strict';
      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'assets/vendor/pdf.worker.min.js';
      }
      /* 宿主注入 spark 后（DOM 就绪回调）装配；无宿主环境（直开调试）直接装配 */
      if (window.spark && typeof spark.onEnter === 'function') {
        spark.onEnter(function () { PDFED.shell.boot(); });
      } else {
        PDFED.shell.boot();
      }
    })();
  </script>
</body>
</html>
