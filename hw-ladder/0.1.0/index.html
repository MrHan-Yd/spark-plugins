<!doctype html>
<html lang="zh-Hans" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>硬件天梯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4v-6H4v6Zm6 0h4V8h-4v12Zm6 0h4v-9h-4v9Z"/></svg>
      <span>硬件天梯</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-cat="cpu">CPU</button>
      <button class="tab" data-cat="gpu">GPU</button>
      <button class="tab" data-cat="disk">硬盘</button>
      <button class="tab" data-cat="ram">内存</button>
      <button class="tab" data-cat="soc">SoC</button>
      <button class="tab" data-cat="compare">对比</button>
    </nav>
    <div class="tools">
      <input id="search" type="text" placeholder="搜索型号,如 9950X / RTX 4090…" spellcheck="false" autocomplete="off">
      <button id="theme-btn" class="ghost-btn" title="切换明暗主题">🌙</button>
    </div>
  </header>

  <div id="notice" class="notice" hidden>
    <span id="notice-text"></span>
    <button id="notice-close" class="ghost-btn" title="关闭">✕</button>
  </div>

  <main id="view-ladder" class="ladder-wrap">
    <div class="ladder-head">
      <div class="col-rank">#</div>
      <div class="col-main">型号</div>
      <div class="col-score" id="head-metric">分数</div>
      <div class="col-cmp"></div>
    </div>
    <div id="rows" class="rows"></div>
    <div id="empty" class="empty" hidden>没有匹配的型号</div>
    <div id="sentinel" class="sentinel" hidden></div>
  </main>

  <main id="view-compare" class="cmp-wrap" hidden>
    <div class="cmp-bar">
      <div id="cmp-cats" class="cmp-cats"></div>
      <span id="cmp-metric" class="cmp-metric">—</span>
      <div class="cmp-search-wrap">
        <input id="cmp-search" type="text" placeholder="搜索型号加入对比(回车添加第一个)…" spellcheck="false" autocomplete="off">
        <div id="cmp-suggest" class="cmp-suggest" hidden></div>
      </div>
    </div>
    <div id="cmp-selchips" class="cmp-selchips"></div>
    <div id="cmp-table" class="cmp-table"></div>
    <div id="cmp-empty" class="empty">添加至少 2 个型号开始对比</div>
  </main>

  <div id="cmp-tray" class="cmp-tray" hidden>
    <span class="cmp-label">对比栏</span>
    <div id="cmp-chips" class="cmp-chips"></div>
    <button id="cmp-open" class="cmp-btn" disabled>去对比</button>
    <button id="cmp-clear" class="ghost-btn" title="清空对比栏">清空</button>
  </div>

  <div id="detail-mask" class="detail-mask" hidden>
    <div class="detail-card" role="dialog" aria-modal="true">
      <div class="detail-head">
        <div class="detail-title">
          <div id="detail-name" class="detail-name"></div>
          <div id="detail-meta" class="detail-meta" hidden></div>
        </div>
        <button id="detail-close" class="ghost-btn" title="关闭">✕</button>
      </div>
      <div class="detail-scoreline">
        <div class="detail-scorebox">
          <div id="detail-metric" class="detail-metric"></div>
          <div id="detail-score" class="detail-score"></div>
        </div>
        <div id="detail-rank" class="detail-rank"></div>
      </div>
      <div id="detail-params" class="detail-params"></div>
      <div class="detail-foot">
        <span id="detail-src" class="detail-src"></span>
        <button id="detail-cmp" class="cmp-btn"></button>
      </div>
    </div>
  </div>

  <footer class="statusbar">
    <span id="src-badge" class="src-badge">—</span>
    <span id="status-text" class="status-text">初始化…</span>
    <span class="spacer"></span>
    <label class="src-picker" for="source-select">数据源</label>
    <select id="source-select" title="切换数据源"></select>
    <button id="refresh" class="refresh-btn" title="强制刷新(重新联网抓取)">⟳ 刷新</button>
  </footer>

  <script src="data/builtin-cpu.js"></script>
  <script src="data/builtin-gpu.js"></script>
  <script src="data/builtin-disk.js"></script>
  <script src="data/builtin-ram.js"></script>
  <script src="data/builtin-soc.js"></script>
  <script src="sources.js"></script>
  <script src="compare.js"></script>
  <script src="app.js"></script>
</body>
</html>
