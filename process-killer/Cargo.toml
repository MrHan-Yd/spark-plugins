[package]
name = "spark-plugin-process-killer"
version = "0.1.0"
edition = "2021"
description = "Spark native 插件:进程终结者(端口/PID/进程名聚合搜索并结束进程)"

[[bin]]
name = "spark-plugin-process-killer"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_NetworkManagement_IpHelper",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true